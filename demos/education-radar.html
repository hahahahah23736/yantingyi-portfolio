<style>
/* ============================================================
   EduRadar OS — K12 教学创新雷达 × 内容生产系统
   Dual theme design system
   ============================================================ */
*,*::before,*::after { box-sizing: border-box; }
:root {
  --font-ui: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-display: "Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --font-mono: "SFMono-Regular","SF Mono",Menlo,Consolas,monospace;
  --r-xs: 6px; --r-sm: 9px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px;
  --ease: cubic-bezier(.22,.8,.28,1);
  --dur: .28s;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #080d15;
  --bg-2: #0c131f;
  --panel: #101a2a;
  --panel-2: #142034;
  --panel-3: #1a2941;
  --ink: #edf3ff;
  --ink-2: #c8d4e6;
  --muted: #8ea0b8;
  --soft: #627286;
  --line: rgba(148,171,201,.16);
  --line-strong: rgba(148,171,201,.28);
  --accent: #5eead4;
  --accent-deep: #14b8a6;
  --accent-soft: rgba(94,234,212,.11);
  --amber: #fbbf24;
  --amber-soft: rgba(251,191,36,.11);
  --blue: #93c5fd;
  --blue-soft: rgba(147,197,253,.1);
  --coral: #fb7185;
  --coral-soft: rgba(251,113,133,.1);
  --green: #34d399;
  --green-soft: rgba(52,211,153,.1);
  --purple: #c4b5fd;
  --purple-soft: rgba(196,181,253,.1);
  --shadow: 0 24px 70px rgba(0,0,0,.28);
  --shadow-sm: 0 8px 26px rgba(0,0,0,.16);
  --hero-glow-a: rgba(94,234,212,.13);
  --hero-glow-b: rgba(147,197,253,.1);
  --hero-glow-c: rgba(251,191,36,.07);
  --grid: rgba(148,171,201,.09);
  --paper: #0b1420;
  --on-accent: #06201d;
  --scrim: rgba(3,7,13,.72);
  --thumb-overlay: linear-gradient(180deg, rgba(8,13,21,.1), rgba(8,13,21,.78));
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f1e8;
  --bg-2: #ece7da;
  --panel: #fbf9f3;
  --panel-2: #f6f2e8;
  --panel-3: #eee8db;
  --ink: #18212b;
  --ink-2: #2a3744;
  --muted: #657282;
  --soft: #8b96a4;
  --line: rgba(51,63,76,.13);
  --line-strong: rgba(51,63,76,.23);
  --accent: #0f766e;
  --accent-deep: #115e59;
  --accent-soft: rgba(15,118,110,.09);
  --amber: #b45309;
  --amber-soft: rgba(180,83,9,.09);
  --blue: #1d4ed8;
  --blue-soft: rgba(29,78,216,.08);
  --coral: #be123c;
  --coral-soft: rgba(190,18,60,.07);
  --green: #15803d;
  --green-soft: rgba(21,128,61,.08);
  --purple: #6d28d9;
  --purple-soft: rgba(109,40,217,.07);
  --shadow: 0 24px 60px rgba(48,42,30,.12);
  --shadow-sm: 0 8px 22px rgba(48,42,30,.07);
  --hero-glow-a: rgba(15,118,110,.1);
  --hero-glow-b: rgba(29,78,216,.07);
  --hero-glow-c: rgba(180,83,9,.07);
  --grid: rgba(51,63,76,.08);
  --paper: #f8f5ec;
  --on-accent: #f7fffd;
  --scrim: rgba(244,241,232,.8);
  --thumb-overlay: linear-gradient(180deg, rgba(24,33,43,.02), rgba(24,33,43,.64));
}

html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 14px; line-height: 1.65;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  transition: background-color .35s var(--ease), color .35s var(--ease);
}
::selection { background: var(--accent-soft); color: var(--ink); }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }
svg { display: block; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.display { font-family: var(--font-display); font-weight: 600; letter-spacing: -.035em; }
.serif { font-family: var(--font-display); }
.mono { font-family: var(--font-mono); }
.eyebrow {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
}
.eyebrow::before { content: ""; width: 18px; height: 1px; background: currentColor; opacity: .7; }
.eyebrow.no-line::before { display: none; }
.muted { color: var(--muted); }
.soft { color: var(--soft); }
.accent { color: var(--accent); }
.small { font-size: 12px; }
.tiny { font-size: 10.5px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; flex: none; }
.dot.amber { background: var(--amber); } .dot.coral { background: var(--coral); }
.hidden { display: none !important; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0,1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; z-index: 30;
  display: flex; flex-direction: column; gap: 0;
  padding: 24px 18px 18px;
  background: var(--bg-2);
  border-right: 1px solid var(--line);
}
.sidebar::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .42;
  background-image: radial-gradient(var(--grid) .7px, transparent .7px);
  background-size: 18px 18px; mask-image: linear-gradient(180deg, #000, transparent 78%);
}
.brand { position: relative; display: flex; align-items: center; gap: 11px; padding: 0 4px 22px; text-decoration: none; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px; flex: none;
  display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent);
  font-family: var(--font-display); font-size: 20px; font-weight: 700;
  box-shadow: 0 8px 24px rgba(94,234,212,.16);
}
.brand-name { font-family: var(--font-display); font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.brand-sub { margin-top: 1px; font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
.side-scope {
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-bottom: 22px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px;
  color: var(--muted); font-size: 10.5px; letter-spacing: .06em;
}
.side-scope b { color: var(--accent); font-family: var(--font-mono); font-size: 10px; font-weight: 500; }
.nav-group { position: relative; margin-bottom: 20px; }
.nav-label { display: block; padding: 0 10px 8px; font-family: var(--font-mono); font-size: 9px; letter-spacing: .15em; color: var(--soft); text-transform: uppercase; }
.nav-item {
  position: relative; width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; margin: 2px 0; border: 0; border-radius: 8px;
  background: transparent; color: var(--muted); text-align: left;
  transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.nav-item:hover { color: var(--ink); background: var(--panel); }
.nav-item.active { color: var(--ink); background: var(--panel); }
.nav-item.active::before {
  content: ""; position: absolute; left: -18px; top: 8px; bottom: 8px; width: 2px;
  background: var(--accent); border-radius: 2px;
}
.nav-item .n-ic { width: 22px; height: 22px; flex: none; display: grid; place-items: center; color: currentColor; }
.nav-item .n-ic svg { width: 16px; height: 16px; stroke-width: 1.6; }
.nav-item .n-label { flex: 1; font-size: 12.5px; font-weight: 500; }
.nav-item .n-index { font-family: var(--font-mono); font-size: 9px; color: var(--soft); }
.nav-item.active .n-index { color: var(--accent); }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 9px; position: relative; }
.evidence-card {
  padding: 12px; border: 1px solid var(--line); border-radius: 10px;
  background: linear-gradient(160deg, var(--panel), transparent);
}
.evidence-card .ec-top { display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--accent); letter-spacing: .08em; font-family: var(--font-mono); }
.evidence-card p { margin: 8px 0 0; color: var(--muted); font-size: 10.5px; line-height: 1.7; }
.side-profile { display: flex; align-items: center; gap: 9px; padding: 6px 4px 0; color: var(--muted); }
.side-profile .avatar { width: 28px; height: 28px; }
.side-profile b { display: block; font-size: 11px; color: var(--ink-2); font-weight: 600; }
.side-profile small { display: block; font-size: 9.5px; color: var(--soft); margin-top: 1px; }

/* ---------- Main / topbar ---------- */
.main { min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 25;
  height: 64px; display: flex; align-items: center; gap: 16px;
  padding: 0 34px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: blur(18px) saturate(1.2);
}
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--soft); font-family: var(--font-mono); font-size: 10px; letter-spacing: .05em; white-space: nowrap; }
.crumbs b { color: var(--ink-2); font-weight: 500; }
.crumbs i { font-style: normal; opacity: .45; }
.topbar-spacer { flex: 1; }
.search-trigger {
  display: flex; align-items: center; gap: 8px; min-width: 236px;
  height: 34px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--muted); font-size: 11.5px; text-align: left;
}
.search-trigger:hover { border-color: var(--line-strong); color: var(--ink-2); }
.search-trigger kbd { margin-left: auto; font-family: var(--font-mono); font-size: 9px; color: var(--soft); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; }
.sync { display: flex; align-items: center; gap: 6px; color: var(--soft); font-family: var(--font-mono); font-size: 9.5px; white-space: nowrap; }
.sync .dot { width: 5px; height: 5px; }
.icon-button {
  width: 34px; height: 34px; display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--muted);
}
.icon-button:hover { color: var(--ink); border-color: var(--line-strong); }
.icon-button svg { width: 15px; height: 15px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 700; border: 0; }
.main-content { max-width: 1500px; margin: 0 auto; padding: 28px 34px 96px; }
.view-in { animation: viewIn .45s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- Generic ---------- */
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin: 6px 0 24px; }
.view-head .vh-left { max-width: 780px; }
.view-head h1 { margin: 10px 0 8px; font-family: var(--font-display); font-size: clamp(28px, 3.4vw, 42px); font-weight: 600; letter-spacing: -.045em; line-height: 1.16; }
.view-head p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.75; max-width: 660px; }
.view-head .vh-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.section { margin-top: 34px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 14px; }
.section-head h2 { margin: 6px 0 0; font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: -.035em; }
.section-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
.section-head .sh-link { color: var(--muted); font-size: 11px; border: 0; background: transparent; padding: 5px 0; display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.section-head .sh-link:hover { color: var(--accent); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 36px; padding: 0 14px; border-radius: 8px;
  border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink-2);
  font-size: 12px; font-weight: 600; transition: all var(--dur) var(--ease);
}
.btn:hover { border-color: var(--muted); color: var(--ink); transform: translateY(-1px); }
.btn svg { width: 14px; height: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); color: var(--on-accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--panel); }
.btn.sm { min-height: 29px; padding: 0 10px; font-size: 10.5px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 28px; padding: 0 10px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  font-size: 10.5px; white-space: nowrap;
}
.chip:hover { color: var(--ink); border-color: var(--line-strong); }
.chip.active { color: var(--ink); background: var(--panel-2); border-color: var(--line-strong); }
.chip .dot { width: 5px; height: 5px; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; width: fit-content;
  padding: 2px 7px; border-radius: 4px; border: 1px solid transparent;
  font-family: var(--font-mono); font-size: 9px; letter-spacing: .03em; white-space: nowrap;
}
.badge.teal { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 24%, transparent); }
.badge.amber { color: var(--amber); background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 24%, transparent); }
.badge.blue { color: var(--blue); background: var(--blue-soft); border-color: color-mix(in srgb, var(--blue) 22%, transparent); }
.badge.coral { color: var(--coral); background: var(--coral-soft); border-color: color-mix(in srgb, var(--coral) 22%, transparent); }
.badge.green { color: var(--green); background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 22%, transparent); }
.badge.purple { color: var(--purple); background: var(--purple-soft); border-color: color-mix(in srgb, var(--purple) 22%, transparent); }
.badge.gray { color: var(--muted); background: var(--panel-2); border-color: var(--line); }
.panel {
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--panel); box-shadow: var(--shadow-sm);
}
.callout {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 13px 15px; border: 1px solid var(--line); border-radius: var(--r-sm);
  color: var(--muted); font-size: 11.5px; line-height: 1.75;
  background: var(--panel);
}
.callout svg { width: 15px; height: 15px; flex: none; color: var(--accent); margin-top: 1px; }
.callout b { color: var(--ink-2); }
.callout.amber svg { color: var(--amber); }
.callout.coral svg { color: var(--coral); }
.callout .callout-action { margin-left: auto; flex: none; }
.rule { height: 1px; background: var(--line); margin: 28px 0; }
.grid { display: grid; gap: 14px; }
.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
.four { grid-template-columns: repeat(4, minmax(0,1fr)); }
.row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.spacer { flex: 1; }
.mt-8 { margin-top: 8px; } .mt-14 { margin-top: 14px; } .mt-22 { margin-top: 22px; }
.hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
.link { color: var(--accent); text-decoration: none; }
.link:hover { text-decoration: underline; }
.scroll-x { overflow-x: auto; scrollbar-width: thin; }

/* ---------- HOME / Command ---------- */
.hero {
  position: relative; overflow: hidden;
  display: grid; grid-template-columns: minmax(0,1.25fr) minmax(320px,.75fr);
  gap: 26px; padding: 36px 38px 34px;
  border: 1px solid var(--line); border-radius: var(--r-xl);
  background:
    radial-gradient(680px 380px at 6% 0%, var(--hero-glow-a), transparent 64%),
    radial-gradient(520px 360px at 98% 8%, var(--hero-glow-b), transparent 60%),
    radial-gradient(440px 300px at 64% 110%, var(--hero-glow-c), transparent 60%),
    var(--panel);
  box-shadow: var(--shadow);
}
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: linear-gradient(120deg, #000, transparent 68%);
}
.hero-copy { position: relative; z-index: 1; }
.hero h1 {
  margin: 15px 0 15px; max-width: 760px;
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(36px, 5.1vw, 66px); line-height: 1.08; letter-spacing: -.06em;
}
.hero h1 em { font-style: italic; color: var(--accent); }
.hero-lead { max-width: 610px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.85; }
.hero-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.hero-meta { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; margin-top: 22px; color: var(--soft); font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .02em; }
.hero-meta span { display: inline-flex; align-items: center; gap: 5px; }
.hero-meta .dot { width: 4px; height: 4px; }
.hero-side { position: relative; min-height: 286px; display: flex; align-items: center; justify-content: center; z-index: 1; }
.radar-visual { width: 100%; max-width: 320px; aspect-ratio: 1; position: relative; }
.radar-visual svg { width: 100%; height: 100%; overflow: visible; }
.radar-visual .ring { fill: none; stroke: var(--line-strong); stroke-width: .8; }
.radar-visual .ring.accent { stroke: color-mix(in srgb, var(--accent) 40%, transparent); }
.radar-visual .spoke { stroke: var(--line); stroke-width: .7; stroke-dasharray: 3 5; }
.radar-visual .blip { fill: var(--accent); filter: drop-shadow(0 0 7px var(--accent)); animation: pulseBlip 3.4s ease-in-out infinite; }
.radar-visual .blip.amber { fill: var(--amber); filter: drop-shadow(0 0 7px var(--amber)); animation-delay: -1.3s; }
.radar-visual .blip.blue { fill: var(--blue); filter: drop-shadow(0 0 7px var(--blue)); animation-delay: -2.1s; }
@keyframes pulseBlip { 0%,100% { opacity: .45; r: 2.4; } 50% { opacity: 1; r: 3.6; } }
.radar-caption { position: absolute; left: 0; right: 0; bottom: 4px; display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 8px; letter-spacing: .08em; color: var(--soft); }
.radar-caption span { display: flex; align-items: center; gap: 5px; }
.hero-stats { position: relative; z-index: 1; grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 0; border-top: 1px solid var(--line); padding-top: 18px; margin-top: 6px; }
.hero-stat { padding: 0 18px; border-left: 1px solid var(--line); }
.hero-stat:first-child { border-left: 0; padding-left: 0; }
.hero-stat b { display: block; font-family: var(--font-display); font-size: 29px; font-weight: 600; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.hero-stat span { display: block; margin-top: 6px; font-size: 10px; color: var(--muted); }
.loop { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--panel); }
.loop-step { position: relative; padding: 16px 16px 15px; border-left: 1px solid var(--line); min-width: 0; text-align: left; background: transparent; color: inherit; border-top: 0; border-right: 0; border-bottom: 0; }
.loop-step:first-child { border-left: 0; }
.loop-step:hover { background: var(--panel-2); }
.loop-step:not(:last-child)::after { content: "→"; position: absolute; right: 8px; top: 16px; color: var(--soft); font-family: var(--font-mono); font-size: 12px; }

.inst-mini-list { display: flex; flex-direction: column; }
.inst-mini {
  display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line);
  background: transparent; border-left: 0; border-right: 0; border-top: 0; color: inherit; text-align: left;
}

/* ---------- RADAR ---------- */

.radar-side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 82px; }

.stage-bars { display: flex; flex-direction: column; gap: 8px; }

/* ---------- INSTITUTIONS ---------- */
.inst-layout { display: grid; grid-template-columns: 286px minmax(0,1fr); gap: 18px; align-items: start; }
.inst-list-panel { position: sticky; top: 82px; padding: 12px; max-height: calc(100vh - 108px); display: flex; flex-direction: column; }

.inst-hero { position: relative; overflow: hidden; padding: 24px 26px; border: 1px solid var(--line); border-radius: var(--r-lg); background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 12%, var(--panel)), var(--panel)); }

.inst-hero .ih-metric { padding-left: 14px; border-left: 1px solid var(--line); }
.inst-hero .ih-metric:first-child { border-left: 0; padding-left: 0; }
.inst-hero .ih-metric b { display: block; font-family: var(--font-mono); font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inst-hero .ih-metric span { display: block; margin-top: 3px; color: var(--soft); font-size: 8.5px; }
.inst-tabs { display: flex; align-items: center; gap: 0; margin: 18px 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.inst-tab { position: relative; border: 0; background: transparent; color: var(--muted); padding: 10px 14px; font-size: 11px; white-space: nowrap; }
.inst-tab:first-child { padding-left: 0; }
.inst-tab.active { color: var(--ink); }
.inst-tab.active::after { content: ""; position: absolute; left: 0; right: 12px; bottom: -1px; height: 2px; background: var(--accent); }
.inst-tab:first-child.active::after { left: 0; right: 12px; }
.inst-pane { display: grid; grid-template-columns: minmax(0,1.35fr) minmax(270px,.65fr); gap: 16px; align-items: start; }
.inst-block { padding: 16px; }
.inst-block h3 { margin: 0 0 10px; font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
.fact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fact { border-left: 1px solid var(--line); padding-left: 10px; }
.fact span { display: block; font-size: 8.5px; color: var(--soft); margin-bottom: 3px; }
.fact b { display: block; font-size: 10.5px; line-height: 1.65; font-weight: 500; color: var(--ink-2); }
.product-mini { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

.product-mini .pm span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.move-list { display: flex; flex-direction: column; }
.move-item { display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.move-item:last-child { border-bottom: 0; }
.move-item time { font-family: var(--font-mono); font-size: 8px; color: var(--soft); padding-top: 2px; }
.move-item b { display: block; font-size: 10.5px; line-height: 1.5; }
.move-item p { margin: 3px 0 0; color: var(--muted); font-size: 9.5px; line-height: 1.65; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.role-card span { display: block; margin-top: 3px; color: var(--muted); font-size: 8.5px; line-height: 1.55; }
.company-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }

/* ---------- STUDIO ---------- */
.studio-bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 16px; }

.flow-rail { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--panel); }
.flow-step { position: relative; display: flex; align-items: center; gap: 8px; padding: 11px 10px; border: 0; border-left: 1px solid var(--line); background: transparent; color: inherit; text-align: left; min-width: 0; }
.flow-step:first-child { border-left: 0; }
.flow-step:hover { background: var(--panel-2); }
.flow-step.active { background: var(--panel-2); }
.flow-step.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
.flow-step .fs-no { width: 23px; height: 23px; flex: none; border-radius: 6px; display: grid; place-items: center; background: var(--panel-3); color: var(--muted); font-family: var(--font-mono); font-size: 9px; }
.flow-step.active .fs-no { background: var(--accent); color: var(--on-accent); }
.flow-step.done .fs-no { background: var(--green-soft); color: var(--green); }
.flow-step b { display: block; font-size: 9.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flow-step span { display: block; font-size: 8px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.studio-stage { margin-top: 14px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); overflow: hidden; }
.stage-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 20px 22px 15px; border-bottom: 1px solid var(--line); }
.stage-head .stage-kicker { font-family: var(--font-mono); font-size: 8px; letter-spacing: .12em; color: var(--accent); }
.stage-head h2 { margin: 5px 0 4px; font-family: var(--font-display); font-size: 26px; font-weight: 600; letter-spacing: -.035em; }
.stage-head p { margin: 0; color: var(--muted); font-size: 10.5px; line-height: 1.7; max-width: 700px; }
.stage-head .stage-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.stage-body { padding: 18px 22px 22px; }
.story-layout { display: grid; grid-template-columns: minmax(0,1.35fr) minmax(250px,.65fr); gap: 14px; align-items: start; }
.story-editor { min-height: 340px; width: 100%; resize: vertical; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel-2); color: var(--ink-2); padding: 17px 18px; font-family: var(--font-display); font-size: 15px; line-height: 1.95; outline: 0; }
.story-editor:focus { border-color: var(--accent); }
.story-side { display: flex; flex-direction: column; gap: 10px; }
.check-list { display: flex; flex-direction: column; gap: 7px; }
.check-row { display: flex; align-items: flex-start; gap: 8px; padding: 8px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.check-row .ck-icon { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: var(--green-soft); color: var(--green); flex: none; }
.check-row .ck-icon svg { width: 10px; height: 10px; }
.check-row b { display: block; font-size: 9.5px; }
.check-row span { display: block; margin-top: 2px; color: var(--muted); font-size: 8.5px; line-height: 1.55; }
.script-table { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.script-row { display: grid; grid-template-columns: 42px 120px minmax(0,1fr) 150px; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: start; }
.script-row:last-child { border-bottom: 0; }
.script-row.head { background: var(--panel-2); color: var(--soft); font-family: var(--font-mono); font-size: 8px; letter-spacing: .06em; }
.script-row .sr-no { font-family: var(--font-mono); font-size: 10px; color: var(--accent); }
.script-row b { font-size: 10px; display: block; }
.script-row span { color: var(--muted); font-size: 9px; line-height: 1.55; display: block; }
.board-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 11px; }
.frame-card { border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--panel-2); }
.frame-card.approved { border-color: color-mix(in srgb, var(--green) 55%, var(--line)); }
.frame-canvas { position: relative; aspect-ratio: 16/9; background: #e9ebef; overflow: hidden; }
.frame-canvas svg { width: 100%; height: 100%; display: block; }
.frame-tag { position: absolute; left: 7px; bottom: 7px; padding: 2px 6px; border-radius: 4px; background: rgba(10,15,24,.72); color: #fff; font-family: var(--font-mono); font-size: 8px; }
.frame-check { position: absolute; right: 7px; top: 7px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: #fff; }
.frame-check svg { width: 12px; height: 12px; }
.frame-card .fc-body { padding: 8px 9px; display: flex; align-items: center; gap: 6px; }
.frame-card .fc-body b { font-size: 9.5px; flex: 1; }
.frame-card .fc-body button { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 5px; padding: 3px 6px; font-size: 8px; }
.frame-card .fc-body button:hover { color: var(--accent); border-color: var(--accent); }
.asset-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 11px; }
.asset-card { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel-2); overflow: hidden; }
.asset-art { position: relative; aspect-ratio: 1; display: grid; place-items: center; background: radial-gradient(circle at 30% 20%, var(--panel-3), var(--panel)); }
.asset-art svg { width: 78%; height: 78%; }
.asset-card .ac-body { padding: 9px 10px; }
.asset-card .ac-body b { display: block; font-size: 10px; }
.asset-card .ac-body span { display: block; margin-top: 2px; color: var(--muted); font-size: 8.5px; line-height: 1.55; }
.asset-card .ac-actions { display: flex; gap: 5px; margin-top: 7px; }
.asset-card .ac-actions button { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 5px; padding: 3px 6px; font-size: 8px; }
.asset-card.approved { border-color: color-mix(in srgb, var(--green) 55%, var(--line)); }
.video-list { display: flex; flex-direction: column; gap: 8px; }
.video-row { display: grid; grid-template-columns: 108px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); }
.video-thumb { aspect-ratio: 16/9; border-radius: 5px; overflow: hidden; background: #e9ebef; }
.video-thumb svg { width: 100%; height: 100%; }
.video-row .vr-main b { font-size: 10.5px; display: block; }
.video-row .vr-main span { display: block; margin-top: 2px; color: var(--muted); font-size: 8.5px; line-height: 1.5; }
.video-row .vr-actions { display: flex; align-items: center; gap: 5px; }
.video-row .vr-actions button { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 5px; padding: 4px 7px; font-size: 8px; }
.video-row .vr-actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.video-row.generating { border-color: color-mix(in srgb, var(--amber) 45%, var(--line)); }
.progress-line { height: 3px; border-radius: 3px; background: var(--panel-3); overflow: hidden; margin-top: 5px; }
.progress-line i { display: block; height: 100%; background: var(--amber); }
.export-grid { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(250px,.8fr); gap: 14px; }
.export-frames { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 6px; }
.export-frames .ef { aspect-ratio: 16/9; border-radius: 4px; overflow: hidden; background: #e9ebef; }
.export-frames .ef svg { width: 100%; height: 100%; }
.export-meta { display: flex; flex-direction: column; gap: 6px; }
.export-meta .em-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 9.5px; }
.export-meta .em-row b { color: var(--ink-2); font-family: var(--font-mono); font-size: 9px; font-weight: 500; }
.import-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; min-height: 200px; border: 1.5px dashed var(--line-strong); border-radius: var(--r-sm); color: var(--muted); background: var(--panel-2); text-align: center; font-size: 10px; cursor: pointer; }
.import-zone:hover { border-color: var(--accent); color: var(--accent); }
.import-zone svg { width: 24px; height: 24px; }
.import-preview { display: grid; gap: 10px; }
.import-preview video { width: 100%; max-height: 300px; border-radius: var(--r-sm); background: #000; }

/* canvas mini */
.canvas-shell { position: relative; min-height: 560px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg-2); background-image: radial-gradient(var(--grid) .8px, transparent .8px); background-size: 18px 18px; }
.canvas-toolbar { position: absolute; left: 12px; top: 12px; z-index: 3; display: flex; gap: 6px; }
.canvas-tool { height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--muted); font-size: 9px; }
.canvas-tool:hover { color: var(--ink); }
.canvas-node { position: absolute; width: 168px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow-sm); padding: 8px; cursor: grab; user-select: none; z-index: 2; }
.canvas-node:active { cursor: grabbing; }
.canvas-node .cn-top { display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 7.5px; color: var(--muted); }
.canvas-node .cn-top .dot { width: 3px; height: 3px; }
.canvas-node b { display: block; font-size: 9.5px; margin-top: 5px; line-height: 1.4; }
.canvas-node p { margin: 3px 0 0; color: var(--soft); font-size: 8px; line-height: 1.5; }
.canvas-node .cn-art { margin-top: 6px; aspect-ratio: 16/9; border-radius: 4px; overflow: hidden; background: #e9ebef; }
.canvas-node .cn-art svg { width: 100%; height: 100%; }
.canvas-node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow-sm); }
.canvas-links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.canvas-help { position: absolute; left: 14px; bottom: 12px; z-index: 3; color: var(--soft); font-family: var(--font-mono); font-size: 8px; }
.upload-note { margin-top: 10px; color: var(--soft); font-size: 9px; line-height: 1.6; }

/* ---------- MONITOR ---------- */
.monitor-hero { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(280px,.7fr); gap: 18px; align-items: stretch; }
.monitor-status { padding: 20px; }
.monitor-status .ms-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.monitor-status h2 { margin: 10px 0 3px; font-family: var(--font-display); font-size: 27px; font-weight: 600; letter-spacing: -.04em; }
.monitor-status p { color: var(--muted); font-size: 10.5px; margin: 0; line-height: 1.7; }
.monitor-nums { display: grid; grid-template-columns: repeat(3,1fr); gap: 0; margin-top: 15px; border-top: 1px solid var(--line); padding-top: 13px; }
.monitor-nums .mn { border-left: 1px solid var(--line); padding-left: 13px; }
.monitor-nums .mn:first-child { border-left: 0; padding-left: 0; }
.monitor-nums b { display: block; font-family: var(--font-display); font-size: 25px; font-weight: 600; }
.monitor-nums span { display: block; color: var(--soft); font-size: 8.5px; margin-top: 2px; }
.source-health { padding: 17px; }
.source-health h3 { margin: 0 0 10px; font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.source-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 9px; color: var(--muted); }
.source-row:last-child { border-bottom: 0; }
.source-row b { color: var(--ink-2); font-family: var(--font-mono); font-size: 8px; font-weight: 500; }
.feed { display: flex; flex-direction: column; }
.feed-item { display: grid; grid-template-columns: 72px minmax(0,1fr) auto; gap: 13px; padding: 13px 0; border-bottom: 1px solid var(--line); align-items: start; }
.feed-item:last-child { border-bottom: 0; }
.feed-item .fi-kind { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
.feed-item .fi-date { font-family: var(--font-mono); font-size: 8px; color: var(--soft); }
.feed-item h4 { margin: 0; font-family: var(--font-display); font-size: 16px; font-weight: 600; line-height: 1.45; letter-spacing: -.015em; }
.feed-item p { margin: 4px 0 0; color: var(--muted); font-size: 9.5px; line-height: 1.65; }
.feed-item .fi-meta { color: var(--soft); font-family: var(--font-mono); font-size: 8px; margin-top: 6px; }
.feed-item .fi-unread { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-top: 7px; }
.monitor-grid { display: grid; grid-template-columns: minmax(0,1.5fr) minmax(280px,.7fr); gap: 18px; align-items: start; }

/* ---------- METHOD ---------- */
.method-hero { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(300px,.8fr); gap: 28px; padding: 28px 0 12px; }
.method-hero h1 { margin: 10px 0 14px; font-family: var(--font-display); font-size: clamp(34px,4.4vw,58px); font-weight: 600; letter-spacing: -.055em; line-height: 1.1; }
.method-hero p { max-width: 660px; color: var(--muted); font-size: 13px; line-height: 1.85; }
.method-side { border-left: 1px solid var(--line); padding-left: 22px; display: flex; flex-direction: column; gap: 13px; }
.method-side .ms-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.method-side .ms-row span { color: var(--muted); font-size: 9.5px; }
.method-side .ms-row b { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
.ladder { display: flex; flex-direction: column; gap: 8px; }
.ladder-step { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
.ladder-step .ls-n { font-family: var(--font-mono); font-size: 9px; color: var(--accent); }
.ladder-step b { font-size: 11px; }
.ladder-step span { color: var(--muted); font-size: 9px; }
.ladder-step .badge { justify-self: end; }
.gap-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; }
.gap-card { padding: 13px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
.gap-card b { display: block; font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.gap-card span { display: block; margin-top: 5px; color: var(--muted); font-size: 9px; line-height: 1.65; }
.source-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 7px; }
.source-line { display: flex; align-items: center; gap: 7px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); font-size: 9px; }
.source-line a { color: var(--ink-2); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.source-line a:hover { color: var(--accent); }

/* ---------- Drawer / modal / command / toast ---------- */
.overlay { position: fixed; inset: 0; z-index: 80; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .25s var(--ease); }
.overlay.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 81;
  width: min(520px, 94vw); background: var(--panel); border-left: 1px solid var(--line);
  transform: translateX(102%); transition: transform .32s var(--ease);
  display: flex; flex-direction: column; box-shadow: -20px 0 60px rgba(0,0,0,.2);
}
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 20px 14px; border-bottom: 1px solid var(--line); }
.drawer-head .dh-kicker { font-family: var(--font-mono); font-size: 8px; letter-spacing: .1em; color: var(--accent); }
.drawer-head h2 { margin: 5px 0 0; font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: -.03em; line-height: 1.3; }
.drawer-body { padding: 18px 20px 28px; overflow-y: auto; }
.drawer-body h3 { margin: 16px 0 7px; font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.drawer-body h3:first-child { margin-top: 0; }
.drawer-body p { margin: 0 0 9px; color: var(--muted); font-size: 11.5px; line-height: 1.8; }
.drawer-body .detail-grid { display: grid; grid-template-columns: 90px 1fr; gap: 8px 12px; margin: 12px 0; }
.drawer-body .detail-grid dt { color: var(--soft); font-size: 9px; }
.drawer-body .detail-grid dd { margin: 0; color: var(--ink-2); font-size: 10px; line-height: 1.65; }
.drawer-close { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); color: var(--muted); display: grid; place-items: center; flex: none; }
.drawer-close:hover { color: var(--ink); }
.modal-wrap { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 20px; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .2s; }
.modal-wrap.open { opacity: 1; pointer-events: auto; }
.modal { width: min(720px, 96vw); max-height: 88vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 22px; }
.modal h2 { margin: 0 0 6px; font-family: var(--font-display); font-size: 25px; font-weight: 600; letter-spacing: -.03em; }
.modal .m-sub { color: var(--muted); font-size: 10px; line-height: 1.7; margin-bottom: 14px; }
.modal .m-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.command-wrap { position: fixed; inset: 0; z-index: 95; display: flex; align-items: flex-start; justify-content: center; padding: 12vh 20px 20px; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .2s; }
.command-wrap.open { opacity: 1; pointer-events: auto; }
.command { width: min(620px, 96vw); background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r-md); box-shadow: var(--shadow); overflow: hidden; }
.command-input { display: flex; align-items: center; gap: 9px; padding: 14px 16px; border-bottom: 1px solid var(--line); color: var(--soft); }
.command-input input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 13px; }
.command-results { max-height: 46vh; overflow-y: auto; padding: 6px; }
.command-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px 10px; border: 0; border-radius: 6px; background: transparent; color: inherit; text-align: left; }
.command-item:hover, .command-item.active { background: var(--panel-2); }
.command-item .ci-type { font-family: var(--font-mono); font-size: 7.5px; color: var(--accent); width: 46px; flex: none; }
.command-item b { font-size: 10.5px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.command-item span { display: block; color: var(--soft); font-size: 8.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.command-empty { padding: 28px 14px; text-align: center; color: var(--soft); font-size: 10px; }
.toast-host { position: fixed; right: 22px; bottom: 22px; z-index: 120; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { min-width: 230px; max-width: 340px; padding: 11px 13px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); color: var(--ink-2); font-size: 10.5px; animation: toastIn .3s var(--ease) both; }
.toast b { display: block; font-size: 10.5px; color: var(--ink); margin-bottom: 2px; }
.toast span { color: var(--muted); font-size: 9px; line-height: 1.55; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Mobile nav ---------- */
.mobile-nav { display: none; }
.mobile-menu { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 1320px) {
  .app { grid-template-columns: 228px minmax(0,1fr); }
  .sidebar { padding-left: 14px; padding-right: 14px; }
  .main-content { padding-left: 26px; padding-right: 26px; }
  .hero { padding: 30px 30px 28px; grid-template-columns: minmax(0,1.25fr) minmax(280px,.75fr); }
  .hero h1 { font-size: clamp(34px,4.8vw,58px); }
  .inst-layout { grid-template-columns: 260px minmax(0,1fr); }
  .inst-pane { grid-template-columns: 1fr; }
  .inst-side { display: grid; grid-template-columns: 1fr 1fr; }
}
@media (max-width: 1080px) {
  .home-grid { grid-template-columns: 1fr; }
  .radar-layout { grid-template-columns: 1fr; }
  .radar-side { position: static; display: grid; grid-template-columns: 1fr 1fr; }
  .monitor-grid { grid-template-columns: 1fr; }
  .inst-layout { grid-template-columns: 240px minmax(0,1fr); }
  .inst-hero .ih-metrics { grid-template-columns: repeat(2,1fr); gap: 10px 0; }
  .tech-grid { grid-template-columns: 1fr; }
  .case-rail { grid-template-columns: repeat(2,1fr); }
  .loop-step span { display: none; }
  .hero-side { min-height: 220px; }
  .radar-visual { max-width: 260px; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .main-content { padding: 22px 20px 94px; }
  .topbar { height: 58px; padding: 0 20px; }
  .mobile-nav { display: grid; grid-template-columns: repeat(6,1fr); position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 60; padding: 5px; border: 1px solid var(--line-strong); border-radius: 13px; background: color-mix(in srgb, var(--bg-2) 92%, transparent); backdrop-filter: blur(18px); box-shadow: var(--shadow); }
  .mobile-nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 42px; border: 0; border-radius: 8px; background: transparent; color: var(--soft); font-size: 8px; }
  .mobile-nav button.active { color: var(--accent); background: var(--accent-soft); }
  .mobile-nav svg { width: 15px; height: 15px; }
  .hero { grid-template-columns: 1fr; padding: 26px 24px; }

  --blue-soft: rgba(64, 95, 130, .07);
  --coral: #a35345;
  --coral-soft: rgba(163, 83, 69, .07);
  --green: #426b4c;
  --green-soft: rgba(66, 107, 76, .08);
  --purple: #6b5a7e;
  --purple-soft: rgba(107, 90, 126, .07);
  --shadow: 0 28px 70px rgba(55, 45, 30, .11);
  --shadow-sm: 0 10px 28px rgba(55, 45, 30, .06);

  --hero-glow-b: rgba(153, 106, 48, .08);
  --hero-glow-c: rgba(64, 95, 130, .05);

}
html { font-size: 16px; }
body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14.5px; line-height: 1.7; letter-spacing: .005em;
  background-image: radial-gradient(var(--grid) .6px, transparent .6px);
  background-size: 22px 22px;
}
h1, h2, h3, .display { font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif; }
.eyebrow { font-family: "SFMono-Regular", "SF Mono", Menlo, monospace; font-size: 10.5px; letter-spacing: .13em; color: var(--accent); }
.eyebrow::before { width: 22px; opacity: .55; }
.tiny { font-size: 11px; line-height: 1.55; }
.small { font-size: 12.5px; }
.badge { font-size: 10px; padding: 3px 8px; border-radius: 4px; letter-spacing: .02em; font-family: "PingFang SC", sans-serif; font-weight: 500; }
.chip { min-height: 30px; padding: 0 12px; font-size: 11.5px; font-weight: 500; }
.btn { min-height: 38px; padding: 0 16px; font-size: 12.5px; border-radius: 8px; font-weight: 500; }
.btn.sm { min-height: 31px; padding: 0 11px; font-size: 11px; }
.icon-button { width: 36px; height: 36px; border-radius: 8px; }
.avatar { width: 32px; height: 32px; font-size: 11px; }

/* shell */
.app { grid-template-columns: 268px minmax(0, 1fr); }
.sidebar { padding: 28px 20px 20px; background: var(--bg-2); border-right-color: var(--line); }
.brand { gap: 12px; padding-bottom: 24px; }
.brand-mark { width: 40px; height: 40px; border-radius: 10px; font-size: 20px; background: var(--accent); color: var(--on-accent); box-shadow: none; }

.brand-sub { font-size: 9px; letter-spacing: .18em; color: var(--soft); }
.side-scope { margin-bottom: 25px; padding: 8px 9px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; font-size: 10px; letter-spacing: .08em; }
.side-scope b { font-size: 9.5px; color: var(--soft); font-weight: 400; }
.nav-group { margin-bottom: 22px; }
.nav-label { padding: 0 10px 9px; font-size: 9.5px; letter-spacing: .16em; color: var(--soft); }
.nav-item { padding: 9px 10px; margin: 1px 0; border-radius: 7px; gap: 11px; }
.nav-item.active { background: var(--panel); }
.nav-item.active::before { left: -20px; width: 2px; background: var(--accent); }
.nav-item .n-label { font-size: 12.5px; font-weight: 500; color: var(--muted); }
.nav-item .n-label small { font-size: 10px; color: var(--soft); margin-top: 1px; font-weight: 400; }
.nav-item .n-index { font-size: 9px; color: transparent; }
.nav-item.active .n-label, .nav-item:hover .n-label { color: var(--ink); }
.nav-item.active .n-label small, .nav-item:hover .n-label small { color: var(--muted); }
.nav-item .n-ic svg { width: 16px; height: 16px; }
.sidebar-foot { gap: 10px; }
.evidence-card { padding: 14px; border-radius: 9px; background: var(--panel); border-color: var(--line); }
.evidence-card .ec-top { font-size: 9.5px; color: var(--accent); }

/* top bar */
.topbar { height: 70px; padding: 0 40px; background: color-mix(in srgb, var(--bg) 86%, transparent); border-bottom-color: var(--line); }
.crumbs { font-size: 10px; gap: 9px; letter-spacing: .06em; color: var(--soft); }
.crumbs b { font-weight: 500; color: var(--ink-2); }
.search-trigger { min-width: 270px; height: 36px; border-radius: 8px; background: var(--panel); font-size: 12px; color: var(--muted); }
.search-trigger kbd { font-size: 9px; padding: 2px 5px; }
.sync { font-size: 9.5px; color: var(--soft); }
.icon-button { background: var(--panel); border-color: var(--line); }
.main-content { max-width: 1500px; padding: 34px 40px 110px; }

/* page heads */
.view-head { align-items: flex-end; gap: 28px; margin: 4px 0 30px; }
.view-head .vh-left { max-width: 820px; }

.section { margin-top: 52px; }

.section-head h2 { font-size: 28px; font-weight: 500; letter-spacing: -.035em; }

.panel { border-radius: 12px; border-color: var(--line); background: var(--panel); box-shadow: none; }
.callout { border-radius: 8px; padding: 14px 16px; font-size: 12px; line-height: 1.75; background: var(--panel-2); border-color: var(--line); }
.callout svg { width: 16px; height: 16px; }

/* hero */
.hero { padding: 42px 44px 36px; border-radius: 22px; border-color: var(--line); background: radial-gradient(700px 400px at 2% 0%, var(--hero-glow-a), transparent 65%), radial-gradient(560px 360px at 100% 4%, var(--hero-glow-b), transparent 60%), var(--panel); box-shadow: none; }
.hero::before { background-image: linear-gradient(var(--grid) 1px, transparent 1px); background-size: 100% 74px; opacity: .5; }
.hero h1 { font-size: clamp(40px, 5vw, 62px); font-weight: 500; line-height: 1.1; letter-spacing: -.055em; max-width: 820px; margin: 16px 0 18px; }
.hero h1 em { color: var(--accent); font-weight: 400; }

.radar-visual .ring { stroke: var(--line-strong); }

.radar-visual .blip { fill: var(--accent); filter: none; } .radar-visual .blip.amber { fill: var(--amber); filter: none; } .radar-visual .blip.blue { fill: var(--blue); filter: none; }
.radar-visual text { fill: var(--soft); }
.radar-caption { font-size: 8.5px; color: var(--soft); }
.loop { border-color: var(--line); border-radius: 10px; background: transparent; }
.loop-step { padding: 18px 18px 17px; border-color: var(--line); }
.loop-step:hover { background: var(--panel); }

.home-grid { gap: 22px; }

/* radar / intel / institutions */

.font-display, .display { font-family: var(--font-display); }
@media (max-width: 900px) { .main { background-image: radial-gradient(700px 380px at 90% -5%, var(--hero-glow-a), transparent 65%); } }

/* V3 — navigation: stronger labels, larger targets, tactile icon motion */
.nav-item .n-label { font-weight: 600; font-size: 13px; letter-spacing: .005em; }
.nav-item.active .n-label { font-weight: 700; }
.nav-item .n-ic { transition: transform .22s var(--ease), color .2s ease; }
.nav-item:hover .n-ic { transform: translateY(-1px) scale(1.07); }
.nav-item:active .n-ic { transform: scale(.9); }
.nav-item.active .n-ic { color: var(--accent); }
.icon-button svg { transition: transform .22s var(--ease); }
@media (hover: hover) {
  .icon-button:hover svg { transform: rotate(7deg) scale(1.06); }
}
.icon-button:active svg { transform: scale(.9); }

@media (max-width: 900px) {
  .mobile-nav {
    left: 12px; right: 12px;
    bottom: max(10px, env(safe-area-inset-bottom));
    padding: 6px 5px calc(6px + env(safe-area-inset-bottom));
    border-radius: 16px;
    border-color: var(--line-strong);
    background: color-mix(in srgb, var(--bg-2) 96%, transparent);
    box-shadow: 0 18px 48px rgba(0,0,0,.28), 0 2px 10px rgba(0,0,0,.12);
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 1px;
  }
  .mobile-nav button {
    position: relative;
    min-height: 56px;
    padding: 6px 1px 7px;
    gap: 3px;
    border-radius: 10px;
    background: transparent;
    color: var(--ink-2);
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: .01em;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: color .2s ease, background .2s ease, transform .16s var(--ease);
  }
  .mobile-nav button span { font-weight: 700; }
  .mobile-nav button svg {
    width: 20px; height: 20px; stroke-width: 1.9;
    transition: transform .22s var(--ease), color .2s ease;
  }
  .mobile-nav button:hover { color: var(--ink); background: var(--panel-2); }
  @media (hover: hover) {
    .mobile-nav button:hover svg { transform: translateY(-2px) scale(1.07); }
  }
  .mobile-nav button:active { transform: scale(.93); }
  .mobile-nav button:active svg { transform: scale(.88); }
  .mobile-nav button.active {
    color: var(--accent);
    background: var(--accent-soft);
    font-weight: 800;
  }
  .mobile-nav button.active span { font-weight: 800; }
  .mobile-nav button.active svg { transform: translateY(-1px); }
  .mobile-nav button.active::after {
    content: "";
    position: absolute;
    left: 50%; bottom: 3px;
    width: 15px; height: 2px;
    transform: translateX(-50%);
    border-radius: 2px;
    background: var(--accent);
  }
  .mobile-nav button.nav-tapped svg { animation: navIconPop .46s var(--ease); }
  .mobile-nav button.nav-tapped { animation: navTapGlow .46s ease-out; }
  .main-content { padding-bottom: calc(108px + env(safe-area-inset-bottom)); }
}
@keyframes navIconPop {
  0% { transform: scale(1) translateY(0); }
  35% { transform: scale(1.32) translateY(-3px); }
  68% { transform: scale(.94) translateY(0); }
  100% { transform: scale(1) translateY(0); }
}
@keyframes navTapGlow {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 22%, transparent); }
  70% { box-shadow: 0 0 0 8px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
@media (prefers-reduced-motion: reduce) {
  .nav-item .n-ic, .nav-item .n-label, .mobile-nav button, .mobile-nav button svg, .icon-button svg { transition: none !important; animation: none !important; }
}
/* V3.1 — nav label breathing room and stronger active state */
@media (max-width: 900px) {
  .mobile-nav {
    background: color-mix(in srgb, var(--bg-2) 98%, transparent);
    box-shadow: 0 16px 42px rgba(0,0,0,.30), 0 1px 0 color-mix(in srgb, var(--ink) 8%, transparent) inset;
  }
  .mobile-nav button {
    min-height: 54px;
    padding: 5px 0 6px;
    gap: 3px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0;
  }
  .mobile-nav button span { font-weight: 700; }
  .mobile-nav button.active {
    background: color-mix(in srgb, var(--accent) 13%, var(--panel));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  .mobile-nav button.active span { font-weight: 800; color: var(--accent); }
  .mobile-nav button.active::after { width: 18px; height: 2px; bottom: 3px; }
}
/* V3.2 — compact but bold mobile labels */
@media (max-width: 900px) {
  .mobile-nav button { font-size: 11.5px; font-weight: 700; }
  .mobile-nav button span { font-weight: 700; letter-spacing: .01em; }
  .mobile-nav button.active span { font-weight: 800; }
}
/* V3.3 — icon response across interactive surfaces */
.btn svg { transition: transform .2s var(--ease); }
.btn:hover svg { transform: translateX(1px); }
.btn:active svg { transform: scale(.9); }
.research-entry .re-icon { transition: transform .22s var(--ease), background .2s; }
.research-entry:hover .re-icon { transform: rotate(-4deg) scale(1.06); }
.kids-case:active, .model-card:active, .research-entry:active { transform: scale(.995); }
@media (max-width: 900px) {
  .mobile-nav button.active {
    background: color-mix(in srgb, var(--accent) 17%, var(--panel));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .mobile-nav button.active svg { filter: drop-shadow(0 3px 8px color-mix(in srgb, var(--accent) 22%, transparent)); }
}
/* V3.4 — active icon weight */
@media (max-width: 900px) {
  .mobile-nav button.active svg { stroke-width: 2.2; }
  .mobile-nav button.active { color: var(--accent); }
}

/* ============ CREATOR RADAR ============ */
.creator-spotlight { display: flex; align-items: center; gap: 14px; width: 100%; margin: 0 0 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 11px; background: linear-gradient(100deg, var(--panel), var(--panel-2)); color: inherit; text-align: left; cursor: pointer; transition: border-color .2s, transform .2s, background .2s; }
.creator-spotlight:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); transform: translateY(-1px); }
.creator-spotlight .cs-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.creator-spotlight .cs-icon svg { width: 19px; height: 19px; }
.creator-spotlight .cs-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.creator-spotlight .cs-copy b { font-family: var(--font-display); font-size: 19px; font-weight: 500; letter-spacing: -.02em; }
.creator-spotlight .cs-copy > span:last-child { color: var(--muted); font-size: 11px; line-height: 1.5; }
.creator-spotlight .cs-cta { color: var(--accent); font-size: 11px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.creator-spotlight .cs-cta svg { width: 13px; height: 13px; transition: transform .2s; }
.creator-spotlight:hover .cs-cta svg { transform: translateX(3px); }
.creator-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
.creator-toolbar > .row { flex-wrap: wrap; }
.creator-search { height: 36px; min-width: 260px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
.creator-search svg { width: 14px; height: 14px; }
.creator-search input { font-size: 12px; }
.creator-livebar { display: flex; align-items: flex-start; gap: 9px; padding: 10px 13px; margin: 0 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--muted); font-size: 11px; line-height: 1.65; }
.creator-livebar b { color: var(--ink-2); font-weight: 600; }
.live-pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-top: 5px; flex: none; box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent); animation: livePulse 2.4s ease-out infinite; }
@keyframes livePulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 34%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.creator-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
.creator-card { display: flex; flex-direction: column; padding: 16px 17px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); transition: border-color .2s, transform .2s, background .2s; }
.creator-card:hover { border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); transform: translateY(-1px); background: var(--panel-2); }
.creator-head { display: flex; align-items: flex-start; gap: 11px; }
.creator-avatar { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; font-family: var(--font-display); font-size: 20px; font-weight: 500; color: var(--on-accent); }
.creator-avatar.bili { background: #8db2d8; }
.creator-avatar.dy { background: #d4a08e; }
.creator-avatar.xhs { background: #d49a9b; }
:root[data-theme="light"] .creator-avatar.bili { background: #b8d1e8; }
:root[data-theme="light"] .creator-avatar.dy { background: #e4c2b2; }
:root[data-theme="light"] .creator-avatar.xhs { background: #e3c0c0; }
.creator-title { min-width: 0; flex: 1; }
.creator-platform { display: flex; align-items: center; gap: 5px; color: var(--soft); font-family: var(--font-mono); font-size: 9px; letter-spacing: .04em; }
.platform-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--soft); }
.platform-dot.bili { background: var(--blue); } .platform-dot.dy { background: var(--coral); } .platform-dot.xhs { background: var(--amber); }
.creator-title h3 { margin: 3px 0 2px; font-family: var(--font-display); font-size: 22px; font-weight: 500; letter-spacing: -.03em; line-height: 1.2; }
.creator-handle { color: var(--soft); font-size: 9.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.creator-live-tag { font-family: var(--font-mono); font-size: 8px; letter-spacing: .08em; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 4px; padding: 2px 5px; flex: none; }
.creator-why { margin: 11px 0 9px; color: var(--muted); font-size: 11.5px; line-height: 1.75; }
.creator-tags { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.creator-tags .badge { font-size: 9px; padding: 2px 6px; }
.creator-metric { margin-left: auto; color: var(--soft); font-size: 9px; font-family: var(--font-mono); text-align: right; max-width: 150px; }
.creator-latest { margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--line); }
.creator-label { color: var(--soft); font-size: 9px; letter-spacing: .08em; font-family: var(--font-mono); margin-bottom: 5px; }
.creator-work { display: grid; grid-template-columns: 62px minmax(0,1fr) 14px; align-items: center; gap: 7px; padding: 5px 0; color: var(--muted); text-decoration: none; }
.creator-work:hover { color: var(--ink); }
.creator-work .cw-date { color: var(--soft); font-family: var(--font-mono); font-size: 8.5px; }
.creator-work .cw-title { font-size: 10.5px; line-height: 1.45; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.creator-work .cw-arrow { display: flex; justify-content: flex-end; color: var(--soft); }
.creator-work .cw-arrow svg { width: 12px; height: 12px; }
.creator-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: auto; padding-top: 11px; }
.creator-pattern-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }
.creator-pattern { padding: 14px 15px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
.creator-pattern .row b { font-family: var(--font-display); font-size: 18px; font-weight: 500; }
.creator-pattern .cp-structure { color: var(--ink-2); font-size: 10.5px; line-height: 1.6; margin: 8px 0 5px; }
.creator-pattern p { color: var(--muted); font-size: 10px; line-height: 1.65; margin: 3px 0; }
.creator-pattern .cp-edu { color: var(--accent); font-size: 9.5px; line-height: 1.6; margin-top: 7px; }
.creator-pattern .cp-risk { color: var(--coral); font-size: 9px; line-height: 1.6; margin-top: 3px; }
.copy-template { padding: 17px 18px; margin-top: 14px; }
.copy-template h2 { font-family: var(--font-display); font-size: 23px; font-weight: 500; letter-spacing: -.03em; }
.ct-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; margin-top: 12px; }
.ct-step { padding: 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); }
.ct-time { font-family: var(--font-mono); font-size: 8.5px; color: var(--accent); letter-spacing: .04em; }
.ct-step b { display: block; margin-top: 3px; font-size: 11px; }
.ct-step p { margin: 4px 0; color: var(--muted); font-size: 9.5px; line-height: 1.6; }
.ct-step span { color: var(--soft); font-size: 8.5px; line-height: 1.55; display: block; }
.breakdown-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; margin: 8px 0; }
.breakdown-grid > div { padding: 8px 0; border-top: 1px solid var(--line); }
.breakdown-grid b { font-size: 11px; color: var(--ink-2); }
.breakdown-grid p { margin: 3px 0 0; color: var(--muted); font-size: 10.5px; line-height: 1.7; }
.drawer-works { display: flex; flex-direction: column; gap: 0; margin-bottom: 12px; }
.drawer-works a { display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); color: var(--muted); text-decoration: none; }
.drawer-works a:hover { color: var(--ink); }
.drawer-works span { font-family: var(--font-mono); font-size: 8.5px; color: var(--soft); }
.drawer-works b { font-size: 11px; }
.drawer-works small { grid-column: 2; color: var(--soft); font-size: 9px; margin-top: 2px; }
@media (max-width: 1180px) { .creator-grid { grid-template-columns: 1fr; } .creator-pattern-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 640px) {
  .creator-spotlight { align-items: flex-start; flex-wrap: wrap; }
  .creator-spotlight .cs-copy { flex-basis: calc(100% - 54px); }
  .creator-spotlight .cs-cta { margin-left: 52px; }
  .creator-toolbar { align-items: stretch; }
  .creator-search { min-width: 0; width: 100%; }
  .creator-grid, .creator-pattern-grid, .ct-grid, .breakdown-grid { grid-template-columns: 1fr; }
  .creator-title h3 { font-size: 21px; }
  .creator-metric { max-width: 130px; }
  .creator-work { grid-template-columns: 58px minmax(0,1fr) 12px; }
}
.creator-search { display: flex; align-items: center; gap: 7px; padding: 0 10px; color: var(--soft); }
.creator-search input { flex: 1; width: auto; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 12px; }
.creator-search input::placeholder { color: var(--soft); }

/* ============================================================
   V4 — CINEMATIC AI STUDIO
   References: Runway (hero frame recedes UI), Linear (near-black neutral +
   one accent + hairline borders), Pika (bold compact display), DuoVid (fully
   tokenized light/dark). This is a full visual reset, not a repaint.
   ============================================================ */
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "SFMono-Regular", "SF Mono", Menlo, monospace;
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #08090d;
  --bg-2: #0c0e14;
  --panel: #11141b;
  --panel-2: #171b24;
  --panel-3: #1e2330;
  --ink: #f5f7fb;
  --ink-2: #cbd2de;
  --muted: #9aa3b2;
  --soft: #717a8b;
  --line: rgba(255,255,255,.075);
  --line-strong: rgba(255,255,255,.16);
  --accent: #8b7cff;
  --accent-deep: #6b5cff;
  --accent-soft: rgba(139,124,255,.13);
  --amber: #f2b35f;
  --amber-soft: rgba(242,179,95,.11);
  --blue: #6aa9ff;
  --blue-soft: rgba(106,169,255,.11);
  --coral: #ff7d92;
  --coral-soft: rgba(255,125,146,.10);
  --green: #58d7bb;
  --green-soft: rgba(88,215,187,.10);
  --purple: #b59cff;
  --purple-soft: rgba(181,156,255,.11);
  --shadow: 0 24px 80px rgba(0,0,0,.42);
  --shadow-sm: 0 8px 30px rgba(0,0,0,.25);
  --grid: rgba(255,255,255,.035);
  --hero-glow-a: rgba(124,92,255,.20);
  --hero-glow-b: rgba(65,211,255,.08);
  --hero-glow-c: rgba(255,179,95,.05);
  --paper: #0c0e14;
  --on-accent: #ffffff;
  --scrim: rgba(5,6,10,.72);
  --thumb-overlay: linear-gradient(180deg, rgba(8,9,13,.04), rgba(8,9,13,.86));
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f6fa;
  --bg-2: #eceef5;
  --panel: #ffffff;
  --panel-2: #f7f8fc;
  --panel-3: #eef0f7;
  --ink: #0e1117;
  --ink-2: #2d3340;
  --muted: #5e6879;
  --soft: #8790a1;
  --line: rgba(15,23,42,.08);
  --line-strong: rgba(15,23,42,.16);
  --accent: #5a4bff;
  --accent-deep: #4738e8;
  --accent-soft: rgba(90,75,255,.08);
  --amber: #a96600;
  --amber-soft: rgba(169,102,0,.08);
  --blue: #1e63d8;
  --blue-soft: rgba(30,99,216,.07);
  --coral: #d53d59;
  --coral-soft: rgba(213,61,89,.07);
  --green: #0d947d;
  --green-soft: rgba(13,148,125,.07);
  --purple: #6648e8;
  --purple-soft: rgba(102,72,232,.07);
  --shadow: 0 24px 80px rgba(20,24,45,.10);
  --shadow-sm: 0 8px 30px rgba(20,24,45,.06);
  --grid: rgba(15,23,42,.045);
  --hero-glow-a: rgba(90,75,255,.10);
  --hero-glow-b: rgba(19,166,153,.08);
  --hero-glow-c: rgba(169,102,0,.05);
  --paper: #fbfbfe;
  --on-accent: #ffffff;
  --scrim: rgba(245,246,250,.78);
  --thumb-overlay: linear-gradient(180deg, rgba(245,246,250,.04), rgba(14,17,23,.74));
}
html { font-size: 16px; }
body {
  font-family: var(--font-ui);
  font-size: 15px; line-height: 1.65; letter-spacing: .005em;
  background-color: var(--bg);
  background-image: radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0);
  background-size: 24px 24px;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
h1, h2, h3, h4, .display, .hero h1, .studio-title, .method-hero h1, .drawer-head h2, .modal h2 {
  font-family: var(--font-ui); font-weight: 700; letter-spacing: -.035em;
}
.eyebrow { font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em; color: var(--accent); font-weight: 500; }
.eyebrow::before { width: 18px; height: 1px; background: var(--accent); opacity: .7; }
.tiny { font-size: 11px; line-height: 1.55; }
.small { font-size: 12.5px; line-height: 1.7; }
.badge { border-radius: 999px; font-size: 10px; padding: 3px 9px; font-weight: 600; letter-spacing: .01em; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.chip { border-radius: 999px; min-height: 30px; padding: 0 13px; font-size: 11.5px; font-weight: 600; border-color: var(--line); }
.chip.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn { border-radius: 10px; min-height: 40px; padding: 0 16px; font-size: 12.5px; font-weight: 650; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); box-shadow: none; }
.btn:hover { border-color: var(--line-strong); background: var(--panel-2); color: var(--ink); transform: translateY(-1px); }
.btn.primary { background: linear-gradient(135deg, #9a8cff 0%, #6c5cff 55%, #5544ee 100%); border-color: transparent; color: #fff; box-shadow: 0 8px 24px rgba(90,75,255,.28); }
.btn.primary:hover { box-shadow: 0 12px 32px rgba(90,75,255,.38); color: #fff; }
.btn.sm { min-height: 32px; padding: 0 11px; font-size: 11px; border-radius: 8px; }
.icon-button { width: 38px; height: 38px; border-radius: 10px; background: var(--panel); border-color: var(--line); }
.icon-button:hover { border-color: var(--line-strong); color: var(--ink); background: var(--panel-2); }

/* shell */
.app { grid-template-columns: 272px minmax(0,1fr); background: var(--bg); }
.sidebar { padding: 26px 18px 20px; background: color-mix(in srgb, var(--bg-2) 92%, transparent); border-right: 1px solid var(--line); backdrop-filter: blur(18px); }
.brand { padding-bottom: 22px; }

ttps://github.com/baney75/myelinate","docs_url":"https://github.com/baney75/myelinate/blob/main/skills/lab/SKILL.md","license":"MIT；研究文献、链接媒体与用户课程资料另核权利","evidence":"本轮已读 v2.8.2 发布全文、标签内 README、flashcards Skill、PRIVACY 和 MIT；原 lab 审阅仍为 10 月 31 日记录。没有运行卡片引擎、导出或验证学习效果。","reviewed_at":"2026-11-03"},{"id":"baidu--unlimited-ocr-2","name":"Unlimited OCR 2 · 跨页教研资料解析","provider":"model","kind":"文档解析 / OCR","stages":["教研备课","内容制作","质量迭代"],"levels":"小 / 初 / 高的教研资料处理；教师侧，非学生答题与批改模型","summary":"百度于 10 月 27 日发布的多页 OCR 模型；官方文档支持按页输入图片，输出带页面标记的解析文本，并以滑动窗口机制处理长资料。本日首次收录，尚未运行。","problem":"教研整理长讲义时，跨页段落、题干和表格容易断开，后续检索与课件制作难以追溯原页。","flow":["输入：教研准备授权或自编 PDF，保留页序并转为图片","操作建议：研发按多页解析路径生成带 <PAGE> 标记的文本，教研对照原页核查题干、公式及跨页连接","输出：可追溯页序的资料草稿和错误清单，审核后交给题库/检索/课件流程","交接建议：教研确认内容，开发保留源页映射与失败页，设计只采用审核后的图文"],"pilot":"用 20 页自编理科讲义，对照现有 Docling/olmOCR 路径：含连续段落、跨页表格、公式、图注和低清页。逐页登记漏页/重复页、公式符号错误和跨页连接；关键题干与答案任一未复核不得入库。实测显存、整文耗时、失败恢复和人工修订时间，再判断是否值得接入；不预设效率提升。","limits":"“无限长度”是作者对机制的描述，不等于无限资源或保证零漏字；官方文档也指出缩小页窗口会损害跨窗口连接。未复验基准、中文教材或手写题质量，OCR 不等于理解、批改或难度评估。与 Docling/olmOCR 属同一资料解析家族，新增观察点是跨页上下文，不宣称替代所有解析器。HF 卡片标注 MIT，但独立 LICENSE 路径 404；关联 GitHub 代码仓库 MIT 已读，素材及下游依赖分别核查。示例涉及 trust_remote_code，后续部署需审查代码并固定版本。","cost":"作者的 Transformers 测试环境为 NVIDIA A800 80GB；这是披露的测试配置，不是已证实最低配置。SGLang 路径使用定制 wheel，另有 PDF 转图片依赖；Mac 直接运行与小显存适配未核实。没有下载权重、安装依赖或购买算力。","priority":"研究参考","url":"https://huggingface.co/baidu/Unlimited-OCR-2","docs_url":"https://github.com/baidu/Unlimited-OCR","license":"HF 模型卡标注 MIT；关联代码 MIT 已核；HF 未单列 LICENSE 文件","evidence":"完整读 HF 模型卡文本，并对照 GitHub README 的差异（含评估输出说明）、代码仓库 MIT、HF 元数据。未阅读论文全文或榜单图片，未观看演示回放，未执行代码/下载模型。","reviewed_at":"2026-11-01"},{"id":"jasonlmiles--teacher-workbench","name":"Teacher Workbench · 教研与二讲交接模板","provider":"github","kind":"Skill / 插件","stages":["教研备课","主讲与课堂互动","二讲辅导","测评与家长服务","质量迭代"],"levels":"小 / 初 / 高的教师与教学助理；以加州 K12 为原始背景，国内课程及岗位职责需适配","summary":"教师侧 Skills 集合。本轮重点研究“作答证据分析 → 临时补救分组 → 助教活动包 → 回交主讲”三个任务的衔接；原项目 10 月 17 日已发布，今日首次收录，未运行。","problem":"主讲交给二讲一张低分名单时，常缺少具体错因、可执行任务、帮助边界及再测证据，容易把缺测或提示后完成混同为能力不足或已掌握。","flow":["输入建议：教研提供自编题、答案与判断标准；用虚构学员作答、帮助记录、班级时段及教师容量演练","操作建议：先按原作证据区分观察与解释，再按下一学习目标分组；保留证据不足队列，检查教师/学员时段冲突与未覆盖需求","输出目标：二讲活动包，含可直接使用的说/做脚本、学生任务、独立答案、错答分支、等待安排与新题检查；最后回交主讲","岗位交接：教研审学科与标准，主讲确认目标和授权范围，二讲记录首次/提示后/新题表现，教学管理审核排班及未满足需求。该国内岗位映射为本项目建议"],"pilot":"选小学平均数单元，造 6 份作答：正确且能解释、漏加数据、除数错误、只会套公式、缺测、提示后完成各 1 份。由两名教师检查是否分清“观察/错因假设/缺证据”，再给 1 位二讲、20 分钟和 3 人上限，要求列出冲突与未安排对象。另一位未参与编写的教师只读活动包完成演练，核对任务/答案/分支及独立退出题；保存人工修改与失败项，不预设节时或提分。","limits":"45 项按一个项目及同一教师任务家族计数；只深读作答分析、补救分组、助教活动 3 项，不代表 45 项都已核查。与 Anthropic/Learning Commons 的备课/短测和 Education Agent Skills 的复习安排重叠；差异是可执行交接包、排班约束和回交证据。没有验证自动分组公平性或课堂效果。README/目录为 2.0.0/45 项，发布标签为 0.1；旧 TEACHING_WORKFLOWS 文档仍写 1.2.0/31 项，必须按具体文件版本核对。加州法规/标准和助教岗位不能直接当中国机构 SOP。","cost":"原始文档/模板 MIT 可阅读；实际生成需兼容助手、模型额度、教师核验及本地化。README 披露标准库 Python 辅助脚本；本轮没有执行、导入插件或连接教学账号。多平台打包不等于已在每个平台验证安装。","priority":"研究参考","url":"https://github.com/JasonLMiles/Teacher-Workbench","docs_url":"https://github.com/JasonLMiles/Teacher-Workbench/blob/main/skills/tw-instructional-assistant-small-groups/SKILL.md","license":"MIT（原始源码、指令、模板和文档）；引用的外部资料分别核权利","evidence":"已读 README、MIT、0.1 发布、VALIDATION、三个 Skill 全文及旧工作流文档；目录只查条目清单，不代表全部内容审阅。作者披露 55 个合成数据测试，不是本机复验或学习效果证据。第三方 Skill 仅作研究资料，没有执行；未读附属模板全文、运行脚本或试用平台。","reviewed_at":"2026-11-02"},{"id":"polik18--scratch-editor-ai-bridge","name":"Scratch AI Bridge · 编程作品生成与局部改作","provider":"github","kind":"交互组件","stages":["需求与课程设计","教研备课","内容制作","主讲与课堂互动","二讲辅导"],"levels":"小学高年级 / 初中编程；教师监督，国内课程适配为建议","summary":"作者包文档描述：中文作品需求转成 AI 提示，粘回结构化回复后本机校验并生成 Scratch .sb3；可分析已有项目、给出修复反馈和保留素材的局部改作。使用官方 VM 不等于 Scratch 官方 AI 产品。","problem":"编程课中 AI 返回的代码未必能变成可编辑积木，修错容易重做整个项目，教师也难区分结构有效与游戏行为正确。","flow":["输入：教研写一份虚构“角色移动→碰边反弹→计数”的 3 项需求与验收规则，不上传学生作品。","操作建议：教师把需求交给允许使用的 AI，再将回复粘入 Bridge 校验；先检查生成内容，再在 Scratch 中解释、运行、改一处条件。","输出：可编辑 .sb3、校验/修复报告与局部修改记录；编译成功不代表角色实际按要求运动。","交接建议：主讲讲清事件、循环和条件，二讲根据失败规则布置改作；用学生能解释并改对的新任务验证学习。"],"pilot":"用 3 份自编项目分别测试变量未声明、事件帽错放、修改单个角色。核对原素材/未改角色是否保留、错误反馈是否可定位、导出能否在官方编辑器打开。再用键盘控制、碰撞与重置做行为验收；公开预览 15 秒上限不能证明长时运行。未执行或导入任何真实学生作品。","limits":"第三方公开 beta，不是 Scratch 基金会背书的产品。README 仅声明代表性运行测试，不保证 130 个积木逐个行为验收；功能矩阵 stable 是作者标注，CLI 名称与 README 有差异待核。预览语音/翻译及可选硬件/云功能可能联网，本机读 SB3 不等于整个 AI 链路离线。AGPL-3.0-only，素材、商标及上游组件另核；根 README 沿用上游说明，不能据其 2025 计划判断此桥接发布时间。","cost":"公开页面可研究；完整源码包含 Scratch 工作区，构建成本与依赖较大。AI 调用、教师校验与本地硬件成本另计；本轮只读文档和包配置。","priority":"研究参考","url":"https://github.com/polik18/scratch-editor-ai-bridge","docs_url":"https://github.com/polik18/scratch-editor-ai-bridge/blob/main/packages/scratch-ai-bridge/README.md","license":"AGPL-3.0-only（包配置与根 LICENSE）；上游组件和素材另核","evidence":"已读根及子包 README、功能矩阵、package.json、根 AGPL 标识；发布订阅源为空，API 403。未下载构建包、运行页面/模型、审计源码或验证课堂效果。","reviewed_at":"2026-11-03"},{"id":"thu-maic--openmaic","name":"OpenMAIC · 互动课堂生成与可编辑交付","provider":"github","kind":"平台 / 工作流","stages":["需求与课程设计","教研备课","内容制作","主讲与课堂互动","二讲辅导","质量迭代"],"levels":"全学段教师侧课堂制作参考；本次新增 PBL 建议先试初高中编程课，未验证儿童独立使用","summary":"官方 v1.4.0 将编程项目拆为教学、决策、计划、代码、测试、测验与回顾，并记录进度、生成项目报告。原有课件编辑和导出继续保留；PBL v3 目前只能运行已安装样例或导入项目，尚不能自动生成新项目。本轮仅核查公开资料。","problem":"学生拿到能运行的 AI 代码，教师仍难判断他是否理解需求、能解释修改、能在不破坏旧行为的情况下完成新任务；过程记录与最终成品需要一起交接。","flow":["输入建议：教研给出两个递进的 Python 任务、先备知识、样例输入/输出、错误情形及人工验收依据；采用自编资料和虚构学生身份。","操作建议：产品/教研先审已安装或导入的项目；主讲带着学生依次讨论需求、计划和代码，再运行测试、作答与回顾；研发提前配置隔离沙箱及调用预算。","输出依据：官方文档描述保留工作区和里程碑进度，完成后输出基于记录的报告；二讲可据代码修改与答题记录安排复习，不以交互次数代替掌握程度。","交接建议：教研签核目标和测试，研发负责环境、版本与可恢复性，主讲核对课堂操作，二讲复核 AI 反馈。原有讲解页、测验、HTML 模拟及资源包仍需分别验收。"],"pilot":"建议先由教师用两个递进的 Python 问候任务走通：第一步处理姓名，第二步增加输入清理并保留第一步行为。检查编译成功但测试失败、缺少/损坏测试回执、通过后改代码、取消运行、恢复进度、最终报告引用原记录等分支；验收报告区分环境错误和学生错误。再使用原有 4 页密度课方案检查改稿、答错提示及离线导出。均为待执行试点；本轮没有运行项目、调用模型或使用真实学生数据。","limits":"PBL v3 项目生成尚未开放；无沙箱配置时入口返回 404，不应视为已可用课程生产线。测试回执有源码摘要与独立检查设计，但文档不承诺考试级防作弊；构建成功不等于测试通过，环境故障不应算学生失败。Director 对持续失败子任务仍可能无限重试，Native 子轮次也无总时限/请求上限，需要外部预算和取消保护。v1.4.0 为单向数据库升级，应停旧实例、以数据库备份回滚，不混跑 1.3.x。声音克隆已迁至 CosyVoice，但须同时授权新目标与目录模型，旧声音需重新克隆；不沿用昨日“尚未修复”的判断。导出抓取失败的资产仍可能依赖网络；进度备份也有持续写入例外。未验证教学、安全隔离或生产可靠性。","cost":"Node 服务、PostgreSQL、Agent 模型及实验性共享沙箱提供方；PBL 还需要含 Python 3 的模板、持久检查点存储、显式权限与预览网关。媒体/TTS/模型调用另计。不是打开一个 HTML 就具备完整服务，未测成本或安装。","priority":"研究参考","url":"https://github.com/THU-MAIC/OpenMAIC","docs_url":"https://github.com/THU-MAIC/OpenMAIC/blob/main/README.md","license":"根代码 MIT 已读；mathml2omml 保留 LGPL-3.0-or-later（README 标注及 LGPL 文本），pptxgenjs 包配置标 MIT；依赖、模型与素材分别核查","evidence":"已对照昨日 README 的新增版本历史、阅读 v1.4.0 发布全文及根 MIT；抽读 PBL v3 指南第 1–108、332–412、440–524 行，核查阶段、样例、报告、测试回执和运行限制。子模块仍有 pre-release 表述，正式发布不等于各模型/提供方验收通过。未审计完整源码/内置 Skill，未操作界面、看完视频、部署或试教。GitHub API 失败由官方网页补核，API 最后成功时间不改写。","reviewed_at":"2026-11-05"}],"announcements":[{"id":"evaluators-ts130-20261105","item_id":"learning-commons-org--evaluators","title":"Learning Commons：TypeScript 接入结构化作文论证评估","published_at":"2026-11-04T22:02:53Z","url":"https://github.com/learning-commons-org/evaluators/releases/tag/sdks-typescript-v1.3.0","kind":"官方发布 / SDK 集成更新","reviewed_at":"2026-11-05","change":"SDK 1.3.0 支持整数与结构化输入，并接入既有 Critical Thinking 评估器；修正反馈字段契约。不是新模型或首次发布量规。","impact":"应用建议：初高中英语教研、测评与二讲，可把题目、材料和作文一起核对，针对证据与论证安排修改练习。","action":"建议做 20 篇虚构 8–10 年级英文短议论文，覆盖单来源/多来源、流畅但无证据、语法欠佳但论证充分、引用不匹配等情形；由两名教师独立标注，逐项核对引文、等级与分歧。再检查来源顺序、超长输入、缺字段、空反馈与环境失败是否被误记为低分。保留原方案的 20 张自编数学图一致性测试；静态图测试不替代 HTML 交互验收。本轮只设计方案，未评测或提交学生作文。","boundary":"8–10 年级英文议论文范围；单来源不输出综合指标。未验证中文、课堂效果或自动评分可靠性。官方文档的 SDK 提示滞后，按版本 README/发布登记。","stage":"测评与家长服务","significance":"值得试点"},{"id":"openmaic-v140-20261105","item_id":"thu-maic--openmaic","title":"OpenMAIC v1.4.0：项目学习串联计划、代码、测试与回顾","published_at":"2026-11-04T11:14:16Z","url":"https://github.com/THU-MAIC/OpenMAIC/releases/tag/v1.4.0","kind":"官方发布 / 项目学习运行时","reviewed_at":"2026-11-05","change":"新增 PBL v3 编程项目流程、持久进度和结项报告；仅已安装样例或导入项目可用，尚无 PBL v3 项目自动生成。","impact":"应用建议：初高中编程课程产品/教研定义阶段任务，主讲组织操作，二讲依据测试和解释记录复习，研发负责沙箱和调用保护。","action":"建议先由教师用两个递进的 Python 问候任务走通：第一步处理姓名，第二步增加输入清理并保留第一步行为。检查编译成功但测试失败、缺少/损坏测试回执、通过后改代码、取消运行、恢复进度、最终报告引用原记录等分支；验收报告区分环境错误和学生错误。再使用原有 4 页密度课方案检查改稿、答错提示及离线导出。均为待执行试点；本轮没有运行项目、调用模型或使用真实学生数据。","boundary":"未运行；需要额外沙箱服务与权限。连续失败重试、备份例外、单向数据库升级须先处
