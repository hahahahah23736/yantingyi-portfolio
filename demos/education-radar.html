:[["七年级","适应多学科节奏，打通从算术到代数、从记忆到学科解释的过渡。"],["八年级","按当地课程安排应对新学科和知识密度，关注跨章节连接与两极分化。"],["九年级","结合地区考查要求完成系统复习、专题任务和限时实践；不套用全国一张考试表。"]],"buyer":"家长与学生共同决策，学生的学科困难、自我感受与时间安排需有独立记录。","products":"按实际业务范围区分同步/补弱/拓展、科学编程项目、工具内容与考试复习；地区教材和进度成为关键配置。","design":"建立概念依赖图；把知识、表示、推理与计算分开设计。用阶段测评决定补前置还是继续进度。","teaching":"从现象到关系再到符号，用实验与多表示联动检验理解；课堂保留过程，不只报选择题答案。","tutor":"按概念缺口、审题、表示、运算和任务管理分组；逐渐让学生描述自己的错误与补救计划。","homework":"少量基础确认加必要迁移题，记录过程与预计时间；避免每科独立加量造成总负担失控。","assessment":"前置知识修复、过程解释、综合任务与可比测评并列；校内成绩可作为背景，不能把所有变化归因于机构。","parent":"解释方法与行动，减少只问“考了多少分”；让学生参与家长反馈，逐步承担学习管理。","finish":"给出知识网络中的已掌握/待巩固节点、典型错因和自主复习安排；跨期交接保留教材与进度。","risks":"用更多题代替错误诊断；只按总分分班；不核对地区教材；多科服务互相挤占时间。","example":{"title":"初中物理“凸透镜成像”单元（虚构设计）","goal":"把物距变化、像的性质与图示对应，能用条件解释观察。","path":["诊断：区分物距、像距与焦距。","课堂：先预测，再改变物距观察，记录特殊位置。","辅导：区分条件记忆错误、读图错误和概念混淆。","结课：换情境判断，并说明模型的实验边界。"],"deliver":"实验记录、条件表、解释与迁移任务；网页模型不能代替全部实物实验。","model":null,"proto":null}},{"id":"senior","name":"高中","headline":"在学科模型、推理深度与时间取舍之间建立系统","bands":[["高一","建立学科语言、模型与推理习惯，结合地区政策和兴趣认识选科。"],["高二","连接模块、完成专题与知识网络建设；按学校进度与个人薄弱点调整。"],["高三","分阶段组织系统复习、专题整合、模拟复盘和时间策略；依据地区与选科实际安排。"]],"buyer":"学生深度参与目标、选科和时间决策，家长提供资源支持；目标不能只由家长的排名期待决定。","products":"区分新授、专题、综合复习、个性化1对1和竞赛等不同路线；适用范围、基础门槛和时间成本分别说明。","design":"从模型条件和关键推理构建课序，再配层级任务；试卷、选科和考试时间按地区核查，不把旧考纲直接沿用。","teaching":"假设→建模→推导→检验→应用；将参数范围、近似、边界和常见误用可视化，保留独立推演时间。","tutor":"定位模型选择、推理断点、计算/表达或时间策略；针对瓶颈安排任务，教会复盘而非逐题代解。","homework":"围绕目标选择代表题，记录用时和路径；必要的限时训练与充分的过程解释分开安排。","assessment":"同时看准确性、推理完整、迁移和时间使用；同分学生可能需要完全不同的补救。","parent":"把阶段目标、可用时间、睡眠与总学习负担纳入讨论；用具体任务差距替代分数保证。","finish":"交付专题结构图、模型适用条件、未解决问题和自主复习优先级；继续、转向或暂停都应有理由。","risks":"把难题数量当教学深度；忽视选科/地区；过度承诺提分；机构课程挤占校内复盘。","example":{"title":"高中物理“平抛运动”专题（虚构设计）","goal":"在忽略空气阻力、恒定重力等假设下，用运动分解解释轨迹。","path":["诊断：水平与竖直运动的初始条件。","课堂：调速度/高度，预测轨迹、时间与位移。","辅导：按分解思路、条件遗漏、方程或计算分组。","结课：换条件的任务中判断是否还能使用原模型。"],"deliver":"模型假设卡、推导过程、迁移题及用时；理想化动画不代表所有真实运动。","model":null,"proto":null}}],"stages":[{"id":"insight","order":1,"name":"需求洞察","owner":"产品经理 / 教研负责人","inputs":"访谈、教 title":"Gemini 进 Classroom 全学段","org":"Google for Education","date":"2026-08-10","category":"大模型","summary":"2026-08-10 起，Gemini in Classroom 从 18 岁以上高教学生扩展到全年龄段（需管理员授权），学生可把课程材料转成闪卡、练习测验。Gemini App 同期上线 Study Notebooks，可基于上传材料生成个性化课程。","impact":"Google 用免费生态吃掉日常学习入口，独立学习类 App 面临被替代的压力。","source":{"name":"Google Workspace Updates","url":"https://workspaceupdates.googleblog.com/2026/08/gemini-in-google-classroom-is-expanding-to-users-of-all-ages-with-contextualized-Gemini-starter-prompts-for-students.html"},"tags":["Gemini","Google Classroom","Study Notebooks"],"region":"国外"},{"id":"gl-04","title":"Claude for Education 落地 Emory","org":"Anthropic","date":"2026-10-19","category":"大模型","summary":"2026-10-19，Emory University 向全校师生开放 Claude for Education 申请。该版本核心是 Learning Mode：不直接给答案，而是引导学生逐步推理；Anthropic 此前已与 Northeastern、LSE 等签署全校协议。","impact":"不给答案被写进产品默认交互，教学法而非模型能力成为真正的差异点。","source":{"name":"Emory News","url":"https://news.emory.edu/stories/2026/10/claude-ai-available-emory-university-community"},"tags":["Claude","Learning Mode","高校部署"],"region":"国外"},{"id":"gl-05","title":"Anthropic 对美国 K-12 教师免费","org":"Anthropic","date":"2026-07-14","category":"大模型","summary":"通过认证的美国 K-12 教师可免费使用 Claude Pro 级能力、备课与分层教学技能库，以及对齐全美 50 州学业标准的课程资源。官方规则：2027-06-30 前注册可获整年免费，条款按 K-12 场景单写。","impact":"教师端免费换生态、学区为真正付费方，教师工具市场将进入价格战。","source":{"name":"Anthropic 官方新闻","url":"https://www.anthropic.com/news/claude-for-teachers"},"tags":["Claude","K-12","教师免费"],"region":"国外"},{"id":"gl-06","title":"Microsoft 发布 2026 AI 教育报告","org":"Microsoft","date":"2026-06-24","category":"大模型","summary":"报告显示 92% 的学生与教育管理者、88% 的教育者已在学校用过 AI，58% 教育管理者称学校正在实施或规模化 AI；产品侧同步上线 Unit Plans、Student AI Guidelines、Learning Zone 与 Study and Learn Agent。","impact":"教育版办公套件把 AI 变成默认功能，独立工具必须在教学法上做差异化。","source":{"name":"Microsoft 新闻室","url":"https://microsoft.gcs-web.com/news-releases/news-release-details/microsofts-new-ai-education-report-highlights-widespread"},"tags":["Copilot EDU","学习科学","采用率"],"region":"国外"},{"id":"gl-07","title":"美国 28 州 87 项 AI 教育法案","org":"FutureEd（乔治城大学）","date":"2026-10-06","category":"政策","summary":"2026 年会期追踪到 28 州 87 项课堂 AI 法案、13 项已通过：阿拉巴马把含 AI 的计算机课设为毕业要求，爱达荷要求州级框架，马里兰设学区 AI 协调员，俄克拉荷马要求每学区有书面 AI 政策。","impact":"州级立法成为采购前置条件，产品需内置合规选项：家长退出、人类复核、数据最小化。","source":{"name":"FutureEd 立法追踪","url":"https://www.future-ed.org/legislative-tracker-2026-state-ai-in-education-bills/"},"tags":["州级立法","AI 素养","PISA 2029"],"region":"国外"},{"id":"gl-08","title":"纽约市 60 万学生一学年禁用生成式 AI","org":"纽约市政府","date":"2026-09-02","category":"政策","summary":"2026-27 学年起，纽约市公立学校 2-K 至 8 年级约 60 万学生暂停所有面向学生的生成式 AI 工具，全学段禁止陪伴型聊天机器人；高中生可在监督下使用，但每学年须参加两次 AI 素养课程。","impact":"年龄分层加人类监督成为最大城市的选择，低龄段产品市场将被政策直接压缩。","source":{"name":"The Hindu 深度解释","url":"https://www.thehindu.com/news/international/why-is-new-york-city-pausing-some-ai-tools-in-schools-explained/article71431327.ece"},"tags":["纽约","禁令","年龄分层"],"region":"国外"},{"id":"gl-09","title":"欧盟推迟教育类高风险合规至 2027-12","org":"欧盟","date":"2026-06-16","category":"政策","summary":"欧洲议会以 423 票赞成通过 Digital Omnibus 修正案，把教育所属的 Annex III 高风险系统合规截止日从 2026-08-02 推迟至 2027-12-02，嵌入式系统推迟至 2028-08-02；透明度义务仍按原时间生效。","impact":"约一年窗口期，教育产品必须重做是否构成高风险的判定并补齐透明度文件。","source":{"name":"Bratby Law 解读","url":"https://bratby.law/digital-omnibus-ai-high-risk-delay/"},"tags":["EU AI Act","高风险","合规"],"region":"国外"},{"id":"gl-10","title":"UNESCO IITE 比对 36 个教师 AI 框架","org":"UNESCO IITE","date":"2026-09-27","category":"政策","summary":"UNESCO IITE 与上海开放大学联合发布教师 AI 能力框架分析报告，系统比对 36 个国家、机构与学术框架，覆盖能力维度、战略—战术—操作三层落地路径与评估方法，并给出关键要素清单。","impact":"教师 AI 能力正从培训项目变成可监管、可认证的制度对象，培训与评估需求上升。","source":{"name":"UNESCO IITE","url":"https://iite.unesco.org/news/unesco-iite-has-released-the-analytical-report-teacher-ai-competency-frameworks/"},"tags":["UNESCO","教师能力","能力框架"],"region":"国外"},{"id":"gl-11","title":"Turnitin 把 AI 检测高亮合并为单一蓝色","org":"Turnitin","date":"2026-08-03","category":"政策","summary":"Turnitin 更新 AI 写作报告，原先「AI 生成」蓝标与「AI 修改」紫标合并为单一蓝色，理由是降低过度解读风险。官方同时承认：分数只能作为师生对话起点，不能作为学术诚信决定的唯一依据。","impact":"检测工具从抓作弊转向过程留痕与教学对话，过程性评价产品迎来机会。","source":{"name":"Turnitin 官方博客","url":"https://www.turnitin.com/blog/how-turnitin-is-simplifying-ai-detection-for-educators-and-publishers"},"tags":["学术诚信","AI 检测","Turnitin"],"region":"国外"},{"id":"gl-12","title":"Khanmigo 上线交互图与靶向练习","org":"Khan Academy","date":"2026-08-26","category":"AI应用","summary":"借助 Google.org Fellowship 与 Gemini 模型，Khanmigo 新增用交互式示意图帮学生可视化数学与科学难点，以及让教师更精细生成靶向练习两类能力，官方定位直指学区采购。","impact":"免费辅导工具向学区级产品演进，微课与动画讲解可借鉴其可视化加靶向练习的结构。","source":{"name":"Khan Academy 博客","url":"https://blog.khanacademy.org/new-ai-tools-bring-interactive-diagrams-and-targeted-practice-thanks-to-khan-academys-partnership-with-google-org/"},"tags":["Khanmigo","可视化","学区采购"],"region":"国外"},{"id":"gl-13","title":"Khanmigo 辅导效果提升 6 个百分点","org":"Khan Academy","date":"2026-04-30","category":"AI应用","summary":"Khanmigo 上线三年后公布最新改进结果：学习成效指标提升 6 个百分点，平台每天承载数百万次练习会话。官方强调严格测试、量化结果、丢弃无效方案的产品流程。","impact":"有对照数据正在成为采购门槛，内容团队应同步设计可测量的学习成效指标。","source":{"name":"Khan Academy 博客","url":"https://blog.khanacademy.org/how-khan-academy-is-building-a-better-ai-tutor-our-most-recent-learnings/"},"tags":["Khanmigo","循证","AI 辅导"],"region":"国外"},{"id":"gl-14","title":"Duolingo 2026Q1 营收同比增 27%","org":"Duolingo","date":"2026-07-12","category":"AI应用","summary":"2026 年 Q1 营收 2.92 亿美元、同比增 27%；日活 5650 万、月活 1.378 亿；截至 2025 年底付费订阅约 1250 万。课程单元产出从 7100 个每季度升至 20500 个，Max 提供 Lily 视频通话。","impact":"AI 把内容产能放大近 3 倍，高频内容加订阅仍是语言学习最稳的商业模型。","source":{"name":"Nasdaq 业绩分析","url":"https://www.nasdaq.com/articles/ai-backed-growth-benefits-duol-amid-expected-rise-in-inference-costs"},"tags":["Duolingo Max","Lily","订阅增长"],"region":"国外"},{"id":"gl-15","title":"Coursera 与 Udemy 合并完成","org":"Coursera","date":"2026-06-19","category":"AI应用","summary":"Coursera 与 Udemy 于 2026-05-10 完成合并，合并后约 2.9 亿学习者、31.5 万门课程。CEO 称平台每 3 秒有人报名一门 AI 课程；Coursera Coach 已进入密歇根大学直播课，用苏格拉底式对话提问。","impact":"AI 辅导员加官方评估成为在线课程平台标配，课程内容需为对话式学习重构。","source":{"name":"CNBC TV18","url":"https://www.cnbctv18.com/business/coursera-sees-surge-in-ai-course-demand-as-upskilling-race-intensifies-greg-hart-19928971.htm"},"tags":["Coursera Coach","合并","AI 课程"],"region":"国外"},{"id":"gl-16","title":"Chegg 裁员 45% 转型技能市场","org":"Chegg","date":"2025-10-27","category":"AI应用","summary":"Chegg 宣布重组并裁减 45% 员工，预计 2026 年费用减少约 1.0—1.1 亿美元，重心转向技能培训市场；2026 年 Q1 营收 6330 万美元、同比 -48%，学术服务 -57%，技能培训 +9%。","impact":"纯答案型内容产品被 AI 直接替代，内容创作者必须向过程、评价与陪练迁移。","source":{"name":"Chegg 重组公告摘要","url":"https://www.sahmcapital.com/news/content/chegg-announces-major-restructuring-cuts-45-of-workforce-actions-will-materially-reduce-2026-non-gaap-expenses-by-100m-110m-and-result-in-expected-charges-of-15m-19m-representing-mostly-cash-severance-payments-2025-10-27"},"tags":["Chegg","裁员","商业模式坍塌"],"region":"国外"},{"id":"gl-17","title":"Pearson 上线官方 PTE AI 模拟练习","org":"Pearson","date":"2026-08-27","category":"AI应用","summary":"Pearson 推出官方 PTE AI 模拟练习，还原真实考试时间安排、题型与评分方式，输出听说读写四维诊断并由 AI 导师给出建议，支持 PTE Academic 与 PTE Core，先在中国与印度上线。","impact":"官方考试权威加 AI 反馈是高利害备考的护城河，第三方备考产品空间被压缩。","source":{"name":"Pearson 中国新闻室","url":"https://pearson.com.cn/news/2026/72ddb410-296b-4e2e-a05e-54634be8db78"},"tags":["Pearson","PTE","AI 备考"],"region":"国外"},{"id":"gl-18","title":"Quizlet 收购 Coconote 接入 ChatGPT","org":"Quizlet","date":"2026-03-13","category":"AI应用","summary":"Quizlet 发布基于学生材料的 AI 学习体验，收购把课堂录音与网课视频转成笔记、闪卡的 AI 笔记应用 Coconote，并成为 ChatGPT 原生应用；2026 年 9 月月访问量约 7195 万，居教育类首位。","impact":"寄生超级应用加收购工作流是中型学习工具的自救路径，单点闪卡已不够。","source":{"name":"EdWeek Market Brief","url":"https://marketbrief.edweek.org/product-development/quizlet-expands-ai-strategy-with-new-study-tool-openai-integration/2026/03"},"tags":["Quizlet","Coconote","ChatGPT 集成"],"region":"国外"},{"id":"gl-19","title":"MagicSchool 融资近 6300 万美元","org":"MagicSchool AI","date":"2026-08-14","category":"AI应用","summary":"由前美国校长 Adeel Khan 创立，经 2023 年种子轮、2024 年 1500 万美元 A 轮、2025 年 4500 万美元 B 轮，累计融资接近 6300 万美元；全球约 800 万教育工作者注册，已扩展到学生与学区场景。","impact":"教师工具免费获客、学区付费被验证，教育者的真实痛点比模型能力更值钱。","source":{"name":"36Kr 英文版","url":"https://eu.36kr.com/en/p/3937907925040262"},"tags":["MagicSchool","融资","教师工具"],"region":"国外"},{"id":"gl-20","title":"SchoolAI 获 ESSA Tier 3 认证","org":"SchoolAI","date":"2026-04-23","category":"AI应用","summary":"SchoolAI 公布与犹他州 Jordan School District 的两年研究：学生批判性思维提升 28%，研究经 Instructure 外审，使其获得 ESSA Tier 3 证据等级，是少数拿到该认定的 AI 教育平台之一。","impact":"证据等级开始决定采购结果，教育 AI 产品必须提前布局第三方研究与认证。","source":{"name":"GlobeNewswire","url":"https://www.globenewswire.com/en/news-release/2026/04/23/3279756/0/en/SchoolAI-Earns-ESSA-Tier-3-Certification-Backed-by-Research-Showing-28-Critical-Thinking-Gain.html"},"tags":["SchoolAI","ESSA","学习成效"],"region":"国外"},{"id":"gl-21","title":"Brisk Teaching 用户破百万","org":"Brisk Teaching","date":"2026-09-10","category":"AI应用","summary":"Brisk 是在 Google Docs、Classroom、Canvas 内直接工作的 Chrome 扩展，称每周为教师节省 10 小时以上；支持差异化材料、按评分标准反馈、检测 AI 写作，以及 Replay 回放学生修改历史。","impact":"在教师现有工具里工作比再装一个平台更易采用，集成式产品是胜出形态。","source":{"name":"Brisk Teaching 博客","url":"https://www.briskteaching.com/post/craft-personalized-student-feedback-in-seconds"},"tags":["Brisk","教师工作流","免费"],"region":"国外"},{"id":"gl-22","title":"Photomath 与 Gauth 的拍照解题统治力","org":"Google（Photomath）/ 字节系（Gauth）","date":"2026-09-15","category":"AI应用","summary":"Photomath 以相机 OCR 覆盖小学到微积分，免费版含分步讲解，Plus 版 9.99 美元每月。Gauth 安装量 1 亿至 5 亿，在菲律宾、印尼、巴西、南非、越南长期居教育免费榜第 1。","impact":"移动端加新兴市场是独立于欧美 AI 辅导员叙事的第二条增长曲线。","source":{"name":"SimilarLabs 横评","url":"https://similarlabs.com/blog/best-ai-math-tools-2026"},"tags":["Photomath","Gauth","拍照搜题"],"region":"国外"},{"id":"gl-23","title":"Sora 2 发布：音画同步与 Cameos","org":"OpenAI","date":"2025-09-30","category":"视频生成","summary":"Sora 2 可生成同步对话与音效、物理运动更准确，并配套 TikTok 式社交应用（首批仅美加 iOS）与 Cameos 功能。教育界关注课堂短片潜力，以及 Common Sense Media 指出的 teen 保护与肖像风险。","impact":"教育短视频进入一句提示成片时代，但未成年人形象与声音授权必须前置设计。","source":{"name":"AFP 通讯社","url":"https://us.afpnews.com/article/?openai-launches-sora-2-with-tiktokstyle-app,77BD3ZQ"},"tags":["Sora 2","Cameos","儿童安全"],"r 学：科学探究/数学认知；艺术：感受与欣赏/表现与创造）。本文件各年龄段“学习点”为对《指南》“目标”部分的压缩改写（非逐字引用），逐条可在教育部答记者问 http://www.moe.gov.cn/jyb_xwfb/s271/201210/t20121015_143257.html 及地方教育局转载全文地方教育局转载全文（嘉峪关市第二幼儿园 https://ey.jygedu.net/index.php/cms/item-view-id-773.shtml ，2026-11-15 可访问）核对。《指南》明确“严禁拔苗助长式的超前教育”，故 3-6 岁视频内容不应把小学学科知识下移。"},"domains":[{"key":"health","name":"健康","subdomains":["身心状况","动作发展","生活习惯与生活能力"],"ageBands":[{"age":"3-4","points":["在提醒下能自然坐直、站直（身心状况·健康体态）","情绪比较稳定，强烈情绪反应时能在成人安抚下逐渐平静（身心状况·情绪安定愉快）","能沿地面直线或较窄低矮物体走一段、双脚交替上下楼梯、双脚连续向前跳（动作发展·平衡与协调）","在提醒下每天早晚刷牙、饭前便后洗手；在帮助下能穿脱衣服鞋袜（生活习惯与生活能力）","不吃陌生人给的东西、不跟陌生人走；走失时能说出自己和家长姓名等简单信息（安全知识）"],"videoIdeas":["15-30 秒刷牙/洗手儿歌动画：一句指令一个动作，副歌重复 3 遍，画面给出“挤牙膏—上下刷—漱口”三格示范","2 分钟生活情境短片：主角想玩滑梯但人多，示范“排队—轮流—说谢谢”，结尾用提问卡停 3 秒等孩子回答","30 秒情绪认知动画：用颜色/天气比喻“生气像打雷”，示范“深呼吸—找大人抱抱”两步平复法"]},{"age":"4-5","points":["在提醒下保持正确站、坐、行走姿势（身心状况·健康体态）","经常保持愉快情绪，不高兴时能较快缓解，愿意把情绪告诉亲近的人（身心状况·情绪安定愉快）","能在较窄低矮物体上平稳走、助跑跨跳、连续自抛自接球（动作发展·平衡与协调）","会用筷子吃饭、能沿边线较直地画简单图形或折纸（动作发展·手的动作灵活协调）","每天按时睡觉起床、刷牙方法基本正确；能自己穿脱衣服扣纽扣、整理自己的物品（生活习惯与生活能力）","认识常见安全标志、能遵守安全规则、知道简单求助方式（安全知识）"],"videoIdeas":["2-3 分钟“安全标志小侦探”情境动画：在超市/马路/幼儿园场景中找标志，画面暂停让孩子指认，再给答案","60 秒筷子/系扣子慢动作示范：分步骤特写 + 节奏口诀，避免真实儿童手部特写（用动画手更安全）","睡前程序动画：刷牙—换睡衣—收玩具—关灯四步图卡式短片，配固定顺序音乐形成条件反射"]},{"age":"5-6","points":["经常保持正确站、坐和行走姿势（身心状况·健康体态）","知道引起自己情绪的原因并努力缓解，表达方式比较适度（身心状况·情绪安定愉快）","能连续跳绳、连续拍球、手脚并用安全爬攀登架（动作发展·平衡与协调）","能熟练使用筷子、沿轮廓线剪出曲线图形、使用简单劳动工具（动作发展·手的动作灵活协调）","主动保护眼睛（连续看电视不超过 30 分钟）、每天早晚主动刷牙且方法正确（生活习惯）","会自己系鞋带、按类别整理物品；能自觉遵守交通规则、知道基本防灾知识（生活自理与安全）"],"videoIdeas":["3 分钟“我的时间表”动画：用可视化时间轴讲清起床/上学/睡觉顺序，配套可打印的任务卡（视频只做示范，不替代真实作息）","90 秒跳绳/拍球分解动画：慢速分解手脚配合，标注“不追求数量、不机械训练”的教研提示","2 分钟防灾小剧场：火灾/地震各 1 个情境，只讲“躲—护—撤”三个动作，避免惊吓画面"]}],"videoTypes":["儿歌动画","生活情境短片","互动示范","真人+动画"],"teachingNotes":"健康领域最忌“说教+恐吓”。3-4 岁以模仿型儿歌和单一动作示范为主；4-5 岁可用“找标志/做选择”的轻互动；5-6 岁才适合多步骤流程与规则讨论。安全类内容必须给正确示范（如过马路牵手、不独自开门），避免展示危险动作的“错误示范”被模仿。屏幕时长本身与该领域目标冲突，视频应控制在 3 分钟内并配套线下动作练习。"},{"key":"language","name":"语言","subdomains":["倾听与表达","阅读与书写准备"],"ageBands":[{"age":"3-4","points":["别人对自己说话时能注意听并做出回应，能听懂日常会话（倾听与表达·认真听）","愿意在熟悉的人面前说话、能大方打招呼，能口齿清楚地说儿歌童谣或复述简短故事（愿意讲话并清楚表达）","在成人提醒下使用恰当礼貌用语（文明的语言习惯）","主动要求成人讲故事、读图书，喜欢跟读韵律感强的儿歌童谣（阅读与书写准备·喜欢听故事看图书）","能听懂短小儿歌或故事，会看画面说出图中有什么、发生了什么事（初步阅读理解）","喜欢用涂涂画画表达一定的意思（书面表达愿望）"],"videoIdeas":["60 秒韵律儿歌动画：每句 5-7 字、押韵、配动作，留 1 拍空拍让孩子跟读","2 分钟“看图说话”短片：画面只给 3 个元素（谁/在哪/做什么），旁白先示范一句完整句，再停顿等孩子说","30 秒礼貌用语情境：打招呼/谢谢/对不起三个微场景，每个场景重复 2 次不同语气"]},{"age":"4-5","points":["在群体中有意识地听与自己有关的信息，能结合情境感受不同语气语调（认真听）","愿意与他人交谈、喜欢谈论自己感兴趣的话题，能基本完整讲述所见所闻（愿意讲话并清楚表达）","别人讲话时能回应，能根据场合调节音量，主动使用礼貌用语（文明的语言习惯）","反复看自己喜欢的图书，喜欢把听过的故事讲给别人听（喜欢听故事看图书）","能根据连续画面提供的信息大致说出故事情节，并产生相应情绪反应（初步阅读理解）","愿意用图画和符号表达自己的愿望和想法（书面表达愿望）"],"videoIdeas":["3 分钟无对白默片动画：只给画面线索，结尾提问“你觉得接下来会发生什么”，训练推测与讲述","2 分钟“语气侦探”短片：同一句话用开心/生气/难过三种语气说，画面给情绪脸谱让孩子匹配","故事续编互动视频：在关键节点暂停，给 2 个选项分支，孩子选完后播放对应结局"]},{"age":"5-6","points":["在集体中能注意听老师或他人讲话，听不懂或有疑问时主动提问（认真听）","能有序、连贯、清楚地讲述一件事情，使用常见形容词、同义词，语言比较生动（愿意讲话并清楚表达）","懂得按次序轮流讲话、不随意打断别人，能依据情境使用恰当语言（如安慰别人）（文明的语言习惯）","专注地阅读图书，对图书和生活情境中的文字符号感兴趣（喜欢听故事看图书）","能根据故事部分情节或画面线索猜想、续编、创编故事，能初步感受文学语言的美（初步阅读理解）","愿意用图画和符号表现事物或故事，会正确书写自己的名字、写画姿势正确（书面表达愿望）"],"videoIdeas":["4 分钟“故事结构”动画：用“开头—麻烦—解决—结尾”四格讲一个原创小故事，再让孩子套用四格讲自己的事","2 分钟古诗/童谣意境动画：一诗一景，重点做画面意境与朗读节奏，不做逐字翻译和默写训练","60 秒“名字书写”动画：只示范正确坐姿与握笔、笔画顺序，明确提示“不要求写得多、不提前写字”"]}],"videoTypes":["儿歌动画","故事动画","看图说话短片","互动问答"],"teachingNotes":"《指南》明确反对用机械记忆和强化训练让幼儿过早识字，语言类视频的核心是“输入韵律+创造开口机会”，不是识字量。3-4 岁做跟读与单句模仿；4-5 岁做情节推测与完整讲述；5-6 岁做续编创编与前书写姿势。所有“互动”必须留真实停顿（3-5 秒）让孩子发声，否则只是看视频。"},{"key":"social","name":"社会","subdomains":["人际交往","社会适应"],"ageBands":[{"age":"3-4","points":["愿意和小朋友一起游戏，愿意与熟悉的长辈一起活动（人际交往·愿意与人交往）","想加入同伴游戏时能友好提出请求，在成人指导下不争抢、不独霸玩具（与同伴友好相处）","能根据自己的兴趣选择游戏，为自己的好行为或成果感到高兴（自尊自信自主）","长辈讲话时能认真听，身边人生病或不开心时表示同情（关心尊重他人）","对群体活动有兴趣、喜欢上幼儿园（社会适应·喜欢并适应群体生活）","在提醒下能遵守游戏和公共场所规则，知道不经允许不能拿别人东西（遵守基本行为规范）"],"videoIdeas":["2 分钟“我能加入吗”情境动画：示范三种加入游戏的说法（我可以一起玩吗/我们交换玩具吧/我来当顾客），每种给一个成功与一个被拒绝后的备选","60 秒幼儿园一日流程动画：入园—晨圈—吃饭—午睡—离园，降低入园焦虑","30 秒“轮流与分享”儿歌：用沙漏/计时器可视化轮流，避免抽象说教"]},{"age":"4-5","points":["喜欢和小朋友一起游戏、有经常一起玩的小伙伴，喜欢和长辈交谈（愿意与人交往）","会运用介绍自己、交换玩具等技巧加入游戏，对大家都喜欢的东西能轮流分享（与同伴友好相处）","能按自己的想法进行游戏，知道自己的优点和长处并感到满意（自尊自信自主）","能注意到别人的情绪并有关心体贴的表现，知道父母职业、体会父母辛劳（关心尊重他人）","愿意并主动参加群体活动，愿意与家长参加社区活动（喜欢并适应群体生活）","感受规则的意义并能基本遵守，知道说谎不对、接受的任务要努力完成（遵守基本行为规范）"],"videoIdeas":["2-3 分钟冲突解决短片：两个角色抢同一辆玩具车，示范“说出感受—提方案—轮流/交换”三步，结尾回放正确做法","90 秒“爸爸妈妈的工作”职业动画：用一天时间线展示父母工作，引导孩子说一句感谢的话","社区探索小短片：超市/邮局/医院各 20 秒，配合“他们为我们做了什么”提问"]},{"age":"5-6","points":["有自己的好朋友也喜欢结交新朋友，有问题愿意向别人请教（愿意与人交往）","活动时能与同伴分工合作、遇到困难一起克服，冲突时能自己协商解决（与同伴友好相处）","能主动发起活动或在活动中出主意，遇到困难能坚持而不轻易求助（自尊自信自主）","能关注别人的情绪和需要并给予力所能及帮助，尊重为大家服务的人（关心尊重他人）","在群体活动中积极快乐，对小学生活有好奇和向往（喜欢并适应群体生活）","理解规则意义、能与同伴协商制定规则，做了错事敢于承认（遵守基本行为规范）"],"videoIdeas":["3 分钟“我们一起搭”项目式动画：4 个角色分工（设计/搬运/搭建/检查），展示一次失败后重新协商规则的过程","2 分钟“上小学是什么样”过渡动画：只讲作息、课间、班级规则三件事，减少想象性焦虑","60 秒“我来帮你”微短片：识别他人需要（哭了/够不到/迷路）并给出合适帮助，避免“多管闲事”式打扰"]}],"videoTypes":["生活情境短片","故事动画","角色扮演示范","互动选择"],"teachingNotes":"社会领域靠观察模仿而非说教，视频应展示“具体行为+行为后果”，少用“你要分享”这类抽象指令。冲突类内容必须给出可执行的脚本（说什么、做什么），并允许“拒绝”的正当表达。归属感内容（家庭、家乡、国家）宜用具体物象（家人的照片、家乡的桥、国旗）而非口号。"},{"key":"science","name":"科学","subdomains":["科学探究","数学认知"],"ageBands":[{"age":"3-4","points":["喜欢接触大自然、对周围很多事物和现象感兴趣，经常问各种问题（科学探究·亲近自然喜欢探究）","对感兴趣的事物能仔细观察发现明显特征，能用多种感官或动作探索物体（初步探究能力）","认识常见动植物并发现其多样性，感知物体软硬、光滑粗糙等特性，感知天气对生活的影响（认识周围事物）","感知周围物体形状多样、体验生活中有数（数学认知·感知数学有用有趣）","能手口一致点数 5 个以内物体并说出总数、按数取物（数、量及数量关系）","能感知物体基本空间位置，理解上下、前后、里外等方位词（形状与空间关系）"],"videoIdeas":["90 秒“猜猜这是什么”感官动画：先给局部/声音/材质特写，让孩子猜，再揭晓并给一个可在家做的小实验","60 秒点数儿歌：画面物体随节奏逐个出现并高亮，手口一致点数 1-5，最后按数取物","2 分钟方位小游戏动画：把小球放到桌子下/盒子里/椅子旁，每步停顿让孩子说方位词"]},{"age":"4-5","points":["喜欢接触新事物、经常问新问题，常动手动脑探索材料（亲近自然喜欢探究）","能对事物或现象观察比较发现相同与不同，根据观察提出问题并大胆猜测（初步探究能力）","能感知动植物生长变化及基本条件、感知溶解传热等性质、感知不同季节特点（认识周围事物）","在指导下感知体会事物可以用形状或数来描述，对环境中的数字含义有探究兴趣（感知数学有用有趣）","能通过数数比较两组物体多少，通过操作理解 5 比 4 多 1 等数量关系（数、量及数量关系）","能感知常见几何图形基本特征并分类，使用中间、旁边等方位词描述位置与方向（形状与空间关系）"],"videoIdeas":["3 分钟“沉与浮”探究动画：先猜—再做—再解释，画面保留“预测表”，鼓励孩子在家用盆复现（不做结论灌输）","2 分钟“谁多谁少”动画：一一对应与数数两种方法各演示一遍，让孩子判断哪种更快","90 秒图形分类短片：把生活物品（盘子/车轮/地砖）与几何图形连线，引导说出“为什么像”"]},{"age":"5-6","points":["对感兴趣的问题总刨根问底，能经常动手动脑寻找答案，探索有发现时感到兴奋满足（亲近自然喜欢探究）","能通过观察比较分析描述物体特征或前后变化，用一定方法验证猜测，用数字/图画/图表记录（初步探究能力）","能察觉动植物外形特征、习性与生存环境的适应关系，探索影子、沉浮等物理现象的条件（认识周围事物）","能发现事物简单的排列规律并尝试创造新规律（感知数学有用有趣）","初步理解量的相对性，借助实际操作理解加减的实际意义，能通过实物操作进行 10 以内加减（数、量及数量关系）","能按语言指示或简单示意图取放物品、能辨别自己的左右（形状与空间关系）"],"videoIdeas":["4 分钟“影子为什么变长”探究短片：同一物体早中晚三次影子对比，示范“提出问题—做记录—得结论”的探究闭环","2 分钟规律创编动画：给出 ABAB/ABB 两种规律，请孩子接着排，并鼓励用动作/声音创造新规律","3 分钟“10 以内加减”情境动画：用分饼干/上客人等真实问题呈现“加”“减”的实际意义，不刷口算题"]}],"videoTypes":["探究短片","互动实验示范","数学情境动画","科普故事"],"teachingNotes":"科学领域最大的风险是“用视频替代动手”。视频只应承担“提出问题、示范方法、呈现结果”，真实探究必须回到线下材料。3-4 岁重感官与点数；4-5 岁重比较、猜测与记录；5-6 岁重验证、图表与规律。数学内容严禁变相刷题，避免把 10 以内加减做成口算训练营。AI 生成科普画面必须由教研核对事实（幻觉风险最高）。"},{"key":"art","name":"艺术","subdomains":["感受与欣赏","表现与创造"],"ageBands":[{"age":"3-4","points":["喜欢观看花草树木、日月星空等大自然中美的事物，容易被鸟鸣风声雨声吸引（感受与欣赏·喜欢自然与生活美）","喜欢听音乐或观看舞蹈、戏剧等表演，乐于观看绘画、泥塑等作品（喜欢欣赏多种艺术形式）","经常自哼自唱或模仿有趣的动作、表情和声调（表现与创造·喜欢艺术活动并大胆表现）","经常涂涂画画、粘粘贴贴并乐在其中（大胆表现）","能模仿学唱短小歌曲、跟随熟悉音乐做身体动作（初步艺术表现与创造能力）","能用声音、动作、姿态模拟自然界事物和生活情景（初步艺术表现与创造能力）"],"videoIdeas":["60 秒“声音猜猜猜”动画：播放鸟鸣/风声/雨声/流水，配抽象色块画面，让孩子说“像什么”","90 秒律动儿歌：固定 4 个动作循环，速度先慢后快，鼓励孩子改编第 5 个动作","2 分钟“颜色变变变”短片：两种颜色混合的动画演示，配“红+黄=橙”的节奏口诀，随后邀请孩子用颜料复现"]},{"age":"4-5","points":["欣赏自然与生活美时关注色彩、形态等特征，喜欢倾听各种声音并感知高低长短强弱（喜欢自然与生活美）","能专心观看喜欢的文艺演出或艺术品，有模仿和参与的愿望，欣赏时产生联想和情绪反应（喜欢欣赏多种艺术形式）","经常唱唱跳跳，愿意参加歌唱、律动、舞蹈、表演活动（喜欢艺术活动并大胆表现）","能用绘画、捏泥、手工制作等多种方式表现所见所想（大胆表现）","能用自然、音量适中的声音基本准确唱歌，能即兴哼唱或给熟悉歌曲编词（初步艺术表现与创造能力）","能用拍手、踏脚或可敲击物品敲打节拍和基本节奏（初步艺术表现与创造能力）"],"videoIdeas":["2 分钟“名画里找颜色”动画：把一幅画拆成色块与形状，让孩子指认并联想生活中的事物（不做“像不像”评价）","90 秒节奏游戏：用身体打击乐（拍手/踏脚/拍腿）做三段节奏，屏幕给可视化节拍点","3 分钟“给旋律编词”示范：给一段简单旋律，示范把“洗手/收玩具”编进歌词，鼓励孩子编自己的版本"]},{"age":"5-6","points":["乐于收集美的物品或向别人介绍自己发现的美的事物，乐于模仿自然界有特点的声音并产生联想（喜欢自然与生活美）","艺术欣赏时常用表情、动作、语言表达理解，愿意与他人分享交流喜爱的艺术作品（喜欢欣赏多种艺术形式）","积极参与艺术活动、有自己比较喜欢的形式，能用多种工具材料或表现手法表达感受与想象（喜欢艺术活动并大胆表现）","艺术活动中能与他人相互配合也能独立表现（大胆表现）","能用基本准确的节奏和音调唱歌，用律动或简单舞蹈动作表现情绪或自然情景（初步艺术表现与创造能力）","能自编自演故事并为表演选择搭配简单服饰、道具或布景（初步艺术表现与创造能力）"],"videoIdeas":["3 分钟“小小策展人”动画：示范如何介绍自己的一幅作品（画了什么/为什么/最喜欢哪里），培养表达而非技法评比","2 分钟“自然材料拼贴”短片：树叶/石头/树枝拼成动物，强调“材料来自户外、过程比结果重要”","4 分钟“自编小   // deterministic scene art for storyboard / canvas
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rand(seed) { let t = seed + 0x6D2B79F5; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ (t >>> 15), 1 | t); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
  function sketch(shot, seed, label) {
    const r = rand((seed || 1) + hash(shot.keywords || shot.visual || 'scene'));
    const W = 480, H = 270;
    const kw = String(shot.keywords || '') + ' ' + String(shot.visual || '');
    const water = /水|池|湖|海|河|溪|雨|浪/.test(kw);
    const sky = /天空|云|太阳|阳光|飞|雨/.test(kw);
    const person = /露露|小|孩子|学生|人|她/.test(kw);
    const hill = /山|远山|田|草|树|花/.test(kw);
    const title = String(shot.title || '');
    const horizon = 128 + r() * 54;
    let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(label || '分镜画面')}">`;
    s += `<defs><linearGradient id="g${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f4f5"/><stop offset="1" stop-color="#e3e5e9"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#g${seed})"/>`;
    if (/池塘|水面/.test(title)) {
      s += `<line x1="0" y1="${horizon + 22}" x2="${W}" y2="${horizon + 22}" stroke="#8e98a6" stroke-width="1" opacity=".6"/>`;
      s += `<path d="M0 ${horizon + 22} Q90 ${horizon - 28} 190 ${horizon + 22} T400 ${horizon + 10}" fill="none" stroke="#7e8897" stroke-width="1" opacity=".45"/>`;
      s += `<path d="M0 ${horizon + 22} Q70 ${horizon + 78} 150 ${horizon + 22}" fill="none" stroke="#7e8897" stroke-width="1" opacity=".35"/>`;
      s += `<ellipse cx="152" cy="${horizon + 62}" rx="46" ry="11" fill="none" stroke="#697483" stroke-width="1.1" opacity=".55"/><path d="M152 ${horizon + 51}v22" stroke="#697483" opacity=".5"/>`;
      s += `<circle cx="356" cy="58" r="18" fill="none" stroke="#939caa" stroke-width="1.1" opacity=".6"/><path d="M330 88h52" stroke="#939caa" opacity=".35"/>`;
      s += `<path d="M70 72q20-18 40 0M120 54q15-12 30 0" fill="none" stroke="#8e98a6" opacity=".4"/>`;
    } else if (/发现露露|特写/.test(title)) {
      s += `<rect x="120" y="52" width="240" height="170" rx="18" fill="none" stroke="#7c8795" stroke-width="1.2" opacity=".55"/>`;
      s += `<circle cx="240" cy="136" r="46" fill="none" stroke="#4e5968" stroke-width="1.5"/><circle cx="226" cy="128" r="16" fill="none" stroke="#8e98a6" opacity=".7"/><path d="M212 152q28 16 56 0" fill="none" stroke="#657180" opacity=".5"/>`;
      s += `<path d="M170 200q70-35 140 0" fill="none" stroke="#7d8795" opacity=".5"/><text x="134" y="72" fill="#7b8694" font-family="monospace" font-size="7">MACRO / DROPLET</text>`;
    } else if (/阳光|飞向|白云/.test(title)) {
      s += `<circle cx="368" cy="56" r="22" fill="none" stroke="#7f8997" stroke-width="1.2"/><path d="M368 20v-8M368 92v8M332 56h-8M412 56h8M342 30l-6-6M394 82l6 6M394 30l6-6M342 82l-6 6" stroke="#7f8997" opacity=".6"/>`;
      s += `<path d="M0 230q40-28 86-12 20-40 68-32 22-36 72-24 34-36 88-10 38-20 86 12v70H0z" fill="none" stroke="#7b8694" stroke-width="1.1" opacity=".55"/>`;
      if (/飞向/.test(title)) s += `<circle cx="194" cy="214" r="9" fill="none" stroke="#4d5765" stroke-width="1.3"/><path d="M194 223v22M184 234l-12 9M204 234l12 9" stroke="#4d5765" stroke-width="1.2" opacity=".75"/>`;
      s += `<path d="M80 96q30-18 60 0M150 76q24-14 48 0" fill="none" stroke="#8b95a3" opacity=".35"/>`;
    } else if (/露露醒来/.test(title)) {
      s += `<line x1="0" y1="${horizon + 45}" x2="${W}" y2="${horizon + 45}" stroke="#8e98a6" stroke-width="1" opacity=".5"/>`;
      s += `<ellipse cx="220" cy="${horizon + 58}" rx="100" ry="18" fill="none" stroke="#778391" opacity=".45"/>`;
      s += `<circle cx="220" cy="${horizon - 36}" r="22" fill="none" stroke="#485360" stroke-width="1.5"/><path d="M220 ${horizon - 14}v45M204 ${horizon + 5}l-20 24M236 ${horizon + 5}l20 24" stroke="#485360" stroke-width="1.4" opacity=".8"/>`;
      s += `<path d="M120 210q30-24 60 0M280 210q30-24 60 0" fill="none" stroke="#8b95a3" opacity=".4"/>`;
    } else {
      s += `<line x1="0" y1="${horizon}" x2="${W}" y2="${horizon}" stroke="#9aa2ad" stroke-width="1.1" opacity=".55"/>`;
      if (sky) s += `<circle cx="${340 + r() * 45}" cy="${44 + r() * 22}" r="${17 + r() * 8}" fill="none" stroke="#8f98a5" stroke-width="1.1" opacity=".7"/>`;
      if (hill) s += `<path d="M0 ${horizon} L92 ${horizon - 46 - r() * 22} L180 ${horizon}Z" fill="none" stroke="#7d8796" stroke-width="1.1" opacity=".55"/><path d="M148 ${horizon} L248 ${horizon - 60 - r() * 20} L352 ${horizon}Z" fill="none" stroke="#7d8796" stroke-width="1.1" opacity=".45"/>`;
      if (water) for (let i = 0; i < 5; i++) s += `<path d="M${30 + i * 54} ${horizon + 26 + i * 17} q34 -7 68 0" fill="none" stroke="#7e8794" stroke-width="1" opacity=".45"/>`;
      if (person) s += `<circle cx="${194 + r() * 22}" cy="${horizon - 58}" r="11" fill="none" stroke="#414a58" stroke-width="1.4"/><path d="M${194 + r() * 22} ${horizon - 47} v31 M${194} ${horizon - 34} l-12 12 M${194} ${horizon - 34} l12 12" stroke="#414a58" stroke-width="1.3" opacity=".8"/>`;
      for (let i = 0; i < 3; i++) s += `<path d="M${20 + i * 33} ${H - 22} q30 -30 62 0" fill="none" stroke="#798391" stroke-width="1" opacity=".35"/>`;
    }
    s += `<text x="18" y="28" fill="#6e7886" font-family="monospace" font-size="8" letter-spacing="1.4">${esc(label || 'SHOT')}</text>`;
    s += `<text x="18" y="${H - 14}" fill="#78828f" font-family="monospace" font-size="7">${esc(shot.shotSize || '')} · ${esc(shot.camera || '')}</text>`;
    s += `</svg>`;
    return s;
  }
  function assetArt(asset, kind) {
    const palettes = { violet: ['#f1ecff', '#8b6ff0'], teal: ['#e7f7f3', '#1a9c8a'], amber: ['#fff4dc', '#d59018'], blue: ['#eaf2ff', '#4c7cf0'], coral: ['#fff0f1', '#d85a6b'] };
    const p = palettes[asset.color] || palettes.violet;
    const label = esc((asset.name || 'ASSET').slice(0, 7));
    if (kind === '场景') return `<svg viewBox="0 0 240 240" aria-hidden="true"><rect width="240" height="240" fill="${p[0]}"/><circle cx="168" cy="65" r="32" fill="none" stroke="${p[1]}" stroke-width="3" opacity=".6"/><path d="M0 158 82 88l68 70 35-38 55 56v64H0z" fill="${p[1]}" opacity=".18"/><path d="M0 178h240M28 202h180" stroke="${p[1]}" opacity=".4"/><text x="18" y="220" fill="${p[1]}" font-family="monospace" font-size="9" letter-spacing="2">${label}</text></svg>`;
    if (kind === '道具') return `<svg viewBox="0 0 240 240" aria-hidden="true"><rect width="240" height="240" fill="${p[0]}"/><path d="M78 72h84l-9 98H87z" fill="none" stroke="${p[1]}" stroke-width="4"/><path d="M96 72c0-20 48-20 48 0M96 98h48M96 126h48" stroke="${p[1]}" stroke-width="3" opacity=".55"/><text x="18" y="220" fill="${p[1]}" font-family="monospace" font-size="9" letter-spacing="2">${label}</text></svg>`;
    return `<svg viewBox="0 0 240 240" aria-hidden="true"><rect width="240" height="240" fill="${p[0]}"/><circle cx="120" cy="82" r="36" fill="none" stroke="${p[1]}" stroke-width="4"/><circle cx="108" cy="76" r="3" fill="${p[1]}"/><circle cx="132" cy="76" r="3" fill="${p[1]}"/><path d="M108 96q12 9 24 0" fill="none" stroke="${p[1]}" stroke-width="3" stroke-linecap="round"/><path d="M92 145q28-22 56 0l14 58H78z" fill="${p[1]}" opacity=".16" stroke="${p[1]}" stroke-width="3"/><text x="18" y="220" fill="${p[1]}" font-family="monospace" font-size="9" letter-spacing="2">${label}</text></svg>`;
  }
  function dateText(v) { if (!v) return '未标注'; const s = String(v).slice(0, 10).replace(/-/g, '.'); return s; }
  function dateOnly(v) { if (!v) return ''; return String(v).slice(0, 10); }
  function byDateDesc(a, b) { return String(b.published_at || b.date || '').localeCompare(String(a.published_at || a.date || '')); }
  function countBy(arr, key) { return arr.reduce((m, x) => { const k = typeof key === 'function' ? key(x) : x[key]; m[k] = (m[k] || 0) + 1; return m; }, {}); }

  /* ---------- shell ---------- */
  function renderShell() {
    const navHtml = ['OBSERVE', 'ANALYSE', 'MAKE', 'STUDY', 'GROUND'].map((group) => `
      <div class="nav-group">
        <span class="nav-label">${group}</span>
        ${views.filter((v) => v.group === group).map((v, i) => `
          <button class="nav-item" data-nav="${v.id}" type="button">
            <span class="n-ic">${icon(v.icon)}</span>
            <span class="n-label">${v.label}<small class="tiny muted" style="display:block;font-weight:400">${v.sub}</small></span>
            <span class="n-index">${String(views.indexOf(v) + 1).padStart(2, '0')}</span>
          </button>`).join('')}
      </div>`).join('');
    document.getElementById('sidebarNav').innerHTML = navHtml;
    document.getElementById('mobileNav').innerHTML = ['home', 'radar', 'institutions', 'studio', 'videoLab', 'kids', 'monitor'].map((id) => viewMap[id]).filter(Boolean).map((v) => `<button data-nav="${v.id}" type="button" aria-label="${esc(v.label)}">${icon(v.icon)}<span>${esc(v.short || v.label)}</span></button>`).join('');
    applyTheme(S.theme, false);
    updateActiveNav();
  }
  function updateActiveNav() {
    $$('.nav-item').forEach((b) => b.classList.toggle('active', b.dataset.nav === S.view));
    $$('.mobile-nav button').forEach((b) => b.classList.toggle('active', b.dataset.nav === S.view));
    const v = viewMap[S.view] || viewMap.home;
    const crumb = $('#crumb');
    if (crumb) crumb.innerHTML = `<i>RADAR OS</i><i>/</i><b>${v.label}</b>`;
    document.title = `${v.label} · 教育智脑 Radar OS`;
  }
  function applyTheme(theme, persist) {
    S.theme = theme === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = S.theme;
    const btn = $('#themeToggle');
    if (btn) { btn.innerHTML = S.theme === 'dark' ? icon('sun') : icon('moon'); btn.setAttribute('aria-label', S.theme === 'dark' ? '切换到亮色' : '切换到暗色'); }
    if (persist !== false) { try { localStorage.setItem('eduradar-theme', S.theme); } catch (e) {} }
  }
  function toggleTheme() {
    applyTheme(S.theme === 'dark' ? 'light' : 'dark');
    toast(S.theme === 'dark' ? '已切换到暗色 · Night Radar' : '已切换到亮色 · Paper Signal', '主题已保存到本机');
  }

  /* ---------- routing ---------- */
  function routeFromHash() { const h = (location.hash || '').replace(/^#\/?/, '').split('?')[0]; return viewMap[h] ? h : 'home'; }
  function go(view) {
    if (!viewMap[view]) view = 'home';
    S.view = view;
    if (location.hash !== '#/' + view) history.pushState(null, '', '#/' + view);
    updateActiveNav();
    renderView();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  function renderView() {
    const root = $('#viewRoot');
    const fn = { home: viewHome, radar: viewRadar, intel: viewIntel, institutions: viewInstitutions, studio: viewStudio, videoLab: viewVideoLab, kids: viewKids, monitor: viewMonitor, method: viewMethod }[S.view] || viewHome;
    root.innerHTML = fn();
    root.classList.remove('view-in');
    void root.offsetWidth;
    root.classList.add('view-in');
    updateActiveNav();
    if (S.view === 'studio') initStudio();
  }

  /* ---------- command / drawer / modal ---------- */
  let lastFocus = null;
  function openDrawer(kicker, title, body) {
    lastFocus = document.activeElement;

    d.innerHTML = `<div class="drawer-head"><div><div class="dh-kicker">${esc(kicker || 'DETAIL')}</div><h2>${title}</h2></div><button class="drawer-close" data-close-drawer aria-label="关闭">${icon('x')}</button></div><div class="drawer-body">${body}</div>`;
    d.classList.add('open');
    $('#overlay').classList.add('open');

  function closeDrawer() { $('#drawer').classList.remove('open'); $('#overlay').classList.remove('open'); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  function openModal(title, sub, body, actions) {

    setTimeout(() => { const b = m.querySelector('[data-close-modal]'); if (b) b.focus(); }, 30);
  }
  function closeModal() { $('#modalWrap').classList.remove('open'); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  function commandItems() {
    const items = [];
    D.radar.items.forEach((x) => items.push({ type: '技术', title: x.name, sub: x.kind + ' · ' + (x.stages || []).slice(0, 2).join(' / '), action: () => { go('radar'); openRadar(x.id); } }));
    D.intel.forEach((x) => items.push({ type: x.region, title: x.title, sub: x.org + ' · ' + x.category, action: () => { go('intel'); openIntel(x.id); } }));
    D.institutions.forEach((x) => items.push({ type: '机构', title: x.name, sub: x.tagline, action: () => { S.inst.key = x.key; go('institutions'); } }));
    studioSteps.forEach((st) => items.push({ type: '工坊', title: st.label, sub: '内容工坊 · ' + st.sub, action: () => { S.studio.mode = 'flow'; S.studio.step = st.id; go('studio'); } }));
    views.forEach((v) => items.push({ type: '页面', title: v.label, sub: v.sub, action: () => go(v.id) }));
    return items;
  }
  function openCommand() {
    const w = $('#commandWrap'); w.classList.add('open');
    const input = $('#commandInput'); input.value = ''; input.focus();
    renderCommand('');

    <div class="section-head mt-14" style="margin-bottom:12px"><div><div class="eyebrow">STRUCTURE / COPY</div><h2>五类爆款结构</h2><p>不是让人照抄，而是知道“为什么这样剪、文案为什么这样写”。</p></div></div>
    <div class="creator-pattern-grid">${(v.creatorPatterns || []).map((p) => `<article class="creator-pattern"><div class="row"><b>${esc(p.name)}</b><span class="badge teal">${esc((p.examples || []).join(' / '))}</span></div><p class="cp-structure">${esc(p.structure)}</p><p>${esc(p.why)}</p><div class="cp-edu">教育怎么用：${esc(p.education)}</div><div class="cp-risk">风险：${esc(p.risk)}</div></article>`).join('')}</div>
    <div class="panel copy-template"><div class="section-head" style="margin-bottom:6px"><div><div class="eyebrow no-line">COPY TEMPLATE</div><h2>30–60 秒 AI 视频文案拆解模板</h2><p>把一个知识点写成可拍、可生成、可验收的结构。</p></div></div><div class="ct-grid">${(v.creatorTemplate || []).map((t) => `<div class="ct-step"><div class="ct-time">${esc(t.time)}</div><b>${esc(t.label)}</b><p>${esc(t.prompt)}</p><span>${esc(t.check)}</span></div>`).join('')}</div></div>`;
  }
  function openCreator(i) {
    const c = (VD().creators || [])[Number(i)]; if (!c) return;
    const b = c.breakdown || {};
    const rows = [['0–3 秒钩子', b.hook], ['结构', b.structure], ['文案', b.copy], ['画面', b.visual], ['声音', b.sound], ['制作推断', b.workflow], ['可复用模板', b.reusable], ['边界', b.caveat]];
    openDrawer('CREATOR / ' + (c.platform || 'AI VIDEO'), esc(c.name), `
      <div class="row" style="margin-bottom:12px"><span class="badge teal">${esc(c.platform)}</span><span class="badge gray">${esc(c.tier || '')}</span><span class="badge gray">${esc(c.confidence || '')}置信</span></div>
      <p>${esc(c.positioning || '')}</p><p class="muted small">${esc(c.followers || '')}</p>
      <a class="btn sm primary" href="${esc(safeUrl(c.profileUrl))}" target="_blank" rel="noopener">${icon('external')} ${esc(c.liveLabel || '打开主页看最新')}</a>
      <h3 style="margin-top:18px">最近公开内容</h3>
      <div class="drawer-works">${(c.latestWorks || []).map((w) => `<a href="${esc(safeUrl(w.url))}" target="_blank" rel="noopener"><span>${esc(dateText(w.date))}</span><b>${esc(w.title)}</b>${w.note ? `<small>${esc(w.note)}</small>` : ''}</a>`).join('')}</div>
      <h3>文案与结构拆解</h3>
      <div class="breakdown-grid">${rows.map(([k, val]) => `<div><b>${esc(k)}</b><p>${esc(val || '—')}</p></div>`).join('')}</div>
      <p class="evidence-note"><b>拆解边界：</b>基于公开主页、公开报道与作品结构的推断，不代表创作者完整方法，也未逐条复现；点击主页看最新。</p>
      ${(c.sourceUrls || []).length ? `<p class="tiny muted" style="line-height:1.8">公开来源：${(c.sourceUrls || []).map((u, i) => `<a class="link" href="${esc(safeUrl(u))}" target="_blank" rel="noopener">来源 ${i + 1} ↗</a>`).join('　')}</p>` : ''}
    `);
  }

  /* ================= ACTIONS ================= */
  function studioAction(act, index) {
    const s = S.studio;
    const i = Number(index);
    if (act === 'demo-story') { s.story = D.demo.story; s.checked = false; renderView(); toast('已载入示例故事', '《小水滴的旅行》'); return; }
    if (act === 'check-story') { s.checked = true; renderView(); toast('内容自检完成', '3 个维度通过 · 演示结论'); return; }
    if (act === 'final-story') { s.checked = true; s.storyFinal = true; s.step = 'script'; renderView(); toast('故事已定稿', '进入分镜逐字稿'); return; }
    if (act === 'regen-script') { s.boardSeeds = s.boardSeeds.map(() => Math.floor(Math.random() * 1e6)); renderView(); toast('逐字稿已重新拆分', '演示：镜头结构保持可读'); return; }
    if (act === 'final-script') { s.scriptFinal = true; s.step = 'board'; renderView(); toast('逐字稿已定稿', '进入黑白分镜'); return; }
    if (act === 'frame-redraw') { s.boardSeeds[i] = Math.floor(Math.random() * 1e9); s.boardApproved[i] = false; renderView(); toast('已重绘', '镜头 ' + (i + 1)); return; }
    if (act === 'frame-approve') { s.boardApproved[i] = !s.boardApproved[i]; renderView(); return; }
    if (act === 'approve-all-frames') { s.boardApproved = s.boardApproved.map(() => true); renderView(); toast('全部通过', '分镜可定稿'); return; }
    if (act === 'final-board') { if (!s.boardApproved.every(Boolean)) { toast('还有未通过的分镜', '逐帧确认或点击全部通过', 'warn'); return; } s.step = 'assets'; renderView(); toast('分镜已定稿', '进入故事资产'); return; }
    if (act === 'gen-all-assets') { s.assets.forEach((a) => { a.generated = true; }); renderView(); toast('资产图已生成', '演示模式 · 可接 Seedream'); return; }
    if (act === 'approve-all-assets') { s.assets.forEach((a) => { a.generated = true; a.approved = true; }); renderView(); toast('全部资产通过', ''); return; }
    if (act === 'gen-asset') { if (s.assets[i]) { s.assets[i].generated = true; renderView(); toast('资产已生成', s.assets[i].name); } return; }
    if (act === 'approve-asset') { if (s.assets[i]) { s.assets[i].generated = true; s.assets[i].approved = !s.assets[i].approved; renderView(); } return; }
    if (act === 'final-assets') { if (!s.assets.every((a) => a.approved)) { toast('还有资产未通过', '请全部通过后再进入镜头', 'warn'); return; } s.step = 'video'; renderView(); toast('资产就绪', '进入逐镜头生成'); return; }
    if (act === 'gen-shot') {
      const v = s.videos[i]; if (!v || v.status !== 'ready') return;
      v.status = 'generating'; v.progress = 0; v.generating = true; renderView();
      const timer = setInterval(() => {
        v.progress = Math.min(100, v.progress + 9 + Math.random() * 13);
        const bar = document.querySelector(`[data-video-progress="${i}"]`); if (bar) bar.style.width = v.progress + '%';
        const label = document.querySelector(`[data-video-progress="${i}"]`)?.closest('.video-row')?.querySelector('.vr-main span'); if (label) label.textContent = '生成中 ' + Math.round(v.progress) + '%';
        if (v.progress >= 100) { clearInterval(timer); v.status = 'review'; v.generating = false; renderView(); toast('镜头生成完成', '请确认或重新生成'); }
      }, 260);
      return;
    }
    if (act === 'confirm-shot') { const v = s.videos[i]; if (v && v.status === 'review') { v.status = 'confirmed'; v.confirmed = true; const next = s.videos.findIndex((x) => x.status === 'locked'); if (next >= 0) s.videos[next].status = 'ready'; renderView(); toast('镜头已确认', next >= 0 ? '下一个镜头已解锁' : '全部镜头已确认'); } return; }
    if (act === 'reset-shot') { const v = s.videos[i]; if (v) { v.status = 'ready'; v.progress = 0; v.confirmed = false; renderView(); } return; }
    if (act === 'to-export') { s.step = 'export'; renderView(); return; }
    if (act === 'download-board') { downloadBoard(); return; }
    if (act === 'download-project') { downloadProject(); return; }
    if (act === 'preview') { toast('演示预览', '分镜已生成；真实视频需接入视频模型'); return; }
    if (act === 'canvas-layout') { const nodes = s.canvasNodes; const xs = [38, 38, 260, 260, 500, 500, 720]; const ys = [40, 150, 40, 150, 40, 150, 96]; nodes.forEach((n, j) => { n.x = xs[j] || 40; n.y = ys[j] || 40; }); renderView(); return; }
    if (act === 'canvas-upload') { $('#canvasFile')?.click(); return; }
    if (act === 'canvas-flow') { s.mode = 'flow'; renderView(); return; }
    if (act === 'film-remove') { s.imported = null; renderView(); return; }
  }
  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'text/html' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }
  function downloadBoard() {
    const frames = D.demo.shots.map((s, i) => `<figure><div class="img">${sketch(s, S.studio.boardSeeds[i], 'SHOT ' + String(i + 1).padStart(2, '0'))}</div><figcaption><b>${String(s.no).padStart(2, '0')} ${esc(s.title)}</b><span>${esc(s.shotSize)} · ${esc(s.camera)} · ${s.duration}s</span><p>${esc(s.dialogue)}</p></figcaption></figure>`).join('');
    download('小水滴的旅行 · 黑白分镜.html', `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>小水滴的旅行 · 黑白分镜</title><style>body{font-family:-apple-system,"PingFang SC",sans-serif;background:#f3f1eb;color:#18212b;padding:30px}h1{font-family:Georgia,"Songti SC",serif}p{color:#657282}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}figure{background:#fff;border:1px solid #d9d2c5;border-radius:12px;overflow:hidden;margin:0}.img svg{width:100%;display:block}figcaption{padding:12px}figcaption b{font-size:14px}figcaption span{font-size:11px;color:#8b96a4;margin-left:7px}figcaption p{font-size:12px;line-height:1.6}</style></head><body><h1>小水滴的旅行 · 黑白分镜</h1><p>小学三年级 · 科学 · 6 个镜头 · EduRadar OS 导出</p><div class="grid">${frames}</div></body></html>`, 'text/html');
    toast('分镜页已下载', '可直接打印或交给美术');
  }
  function downloadProject() {
    const payload = { title: D.demo.title, grade: D.demo.grade, story: S.studio.story, shots: D.demo.shots, boardApproved: S.studio.boardApproved, assets: S.studio.assets, videos: S.studio.videos, exportedAt: new Date().toISOString(), note: 'EduRadar OS demo project' };
    download('小水滴的旅行 · 项目.json', JSON.stringify(payload, null, 2), 'application/json');
    toast('项目 JSON 已下载', '包含故事、镜头、分镜与资产状态');
  }

  /* ================= INIT / EVENTS ================= */
  let commandAll = [];
  function renderCommand(q) {
    commandAll = commandItems();
    const items = commandAll.map((x, i) => ({ ...x, idx: i })).filter((x) => !q || (x.title + x.sub + x.type).toLowerCase().includes(q.toLowerCase())).slice(0, 10);
    $('#commandResults').innerHTML = items.length ? items.map((x, i) => `<button class="command-item ${i === 0 ? 'active' : ''}" data-command-index="${x.idx}"><span class="ci-type">${esc(x.type)}</span><span><b>${esc(x.title)}</b><span>${esc(x.sub || '')}</span></span></button>`).join('') : `<div class="command-empty">没有匹配结果。试试“Skill”“机构”“分镜”。</div>`;
  }
  function renderViewFocus(id) {
    const current = document.getElementById(id);
    const pos = current && current.selectionStart != null ? current.selectionStart : null;
    renderView();
    const next = document.getElementById(id);
    if (next) { next.focus(); if (pos != null && next.setSelectionRange) { try { next.setSelectionRange(pos, pos); } catch (e) {} } }
  }
  function bindEvents() {
    document.addEventListener('click', (e) => {
      const t = e.target;
      const nav = t.closest('[data-nav]'); if (nav) {
        e.preventDefault();
        const mob = t.closest('.mobile-nav [data-nav]');
        if (mob) { mob.classList.remove('nav-tapped'); void mob.offsetWidth; mob.classList.add('nav-tapped'); setTimeout(() => mob.classList.remove('nav-tapped'), 500); }
        go(nav.dataset.nav); return;
      }
      const theme = t.closest('[data-theme-toggle]'); if (theme) { toggleTheme(); return; }
      const command = t.closest('[data-command]'); if (command) { e.preventDefault(); openCommand(); return; }
      if (t.closest('[data-close-drawer]') || t.id === 'overlay') { closeDrawer(); return; }
      if (t.closest('[data-close-modal]') && t.closest('#modalWrap')) { closeModal(); return; }
      if (t.closest('[data-close-command]') || t.id === 'commandWrap') { closeCommand(); return; }
      const ann = t.closest('[data-announcement]'); if (ann) { openAnnouncement(ann.dataset.announcement); return; }
      const radar = t.closest('[data-radar-item]'); if (radar) { openRadar(radar.dataset.radarItem); return; }
      const intel = t.closest('[data-intel-item]'); if (intel) { openIntel(intel.dataset.intelItem); return; }
      const c = t.closest('[data-case]'); if (c) { openCase(c.dataset.case); return; }
      const step = t.closest('[data-step-item]'); if (step) { openStep(step.dataset.stepItem); return; }
      const inst = t.closest('[data-inst-key]'); if (inst) { S.inst.key = inst.dataset.instKey; if (S.view !== 'institutions') go('institutions'); else renderView(); return; }
      const instTab = t.closest('[data-inst-tab]'); if (instTab) { S.inst.tab = instTab.dataset.instTab; renderView(); return; }
      const instRegion = t.closest('[data-inst-region]'); if (instRegion) { S.inst.region = instRegion.dataset.instRegion; renderView(); return; }
      const intelRegion = t.closest('[data-intel-region]'); if (intelRegion) { S.intel.region = intelRegion.dataset.intelRegion; renderView(); return; }
      const intelCat = t.closest('[data-intel-cat]'); if (intelCat) { S.intel.cat = intelCat.dataset.intelCat; renderView(); return; }
      const prio = t.closest('[data-radar-prio]'); if (prio) { S.radar.prio = prio.dataset.radarPrio; renderView(); return; }
      const rstage = t.closest('[data-radar-stage]'); if (rstage) { S.radar.stage = rstage.dataset.radarStage; go('radar'); return; }
      const hstage = t.closest('[data-home-stage]'); if (hstage) { S.radar.stage = hstage.dataset.homeStage; go('radar'); return; }
      const clear = t.closest('[data-radar-clear]'); if (clear) { S.radar = { q: '', kind: '全部', stage: '全部', prio: '全部' }; renderView(); return; }
      const goStudio = t.closest('[data-go-studio]'); if (goStudio) { go('studio'); return; }
      const vtab = t.closest('[data-video-tab]'); if (vtab) { S.videoTab = vtab.dataset.videoTab; renderView(); return; }
      const vcat = t.closest('[data-video-cat]'); if (vcat) { S.videoCat = vcat.dataset.videoCat; renderView(); return; }
      const vmodel = t.closest('[data-video-model]'); if (vmodel) { openVideoModel(vmodel.dataset.videoModel); return; }
      const vskill = t.closest('[data-video-skill-kind]'); if (vskill) { S.videoSkillKind = vskill.dataset.videoSkillKind; renderView(); return; }
      const cplat = t.closest('[data-creator-platform]'); if (cplat) { S.creatorPlatform = cplat.dataset.creatorPlatform; renderView(); return; }
      const creator = t.closest('[data-creator]'); if (creator) { openCreator(creator.dataset.creator); return; }
      const ktab = t.closest('[data-kids-tab]'); if (ktab) { S.kidsTab = ktab.dataset.kidsTab; renderView(); return; }
      const kdomain = t.closest('[data-kids-domain]'); if (kdomain) { S.kidsDomain = kdomain.dataset.kidsDomain; renderView(); return; }
      const ktype = t.closest('[data-kids-type]'); if (ktype) { S.kidsType = ktype.dataset.kidsType; renderView(); return; }
      const kcase = t.closest('[data-kids-case]'); if (kcase) { openKidsCase(kcase.dataset.kidsCase); return; }
      const mode = t.closest('[data-studio-mode]'); if (mode) { S.studio.mode = mode.dataset.studioMode; renderView(); return; }
      const sstep = t.closest('[data-studio-step]'); if (sstep) { S.studio.mode = 'flow'; S.studio.step = sstep.dataset.studioStep; renderView(); return; }
      const sa = t.closest('[data-studio-act]'); if (sa) { studioAction(sa.dataset.studioAct, sa.dataset.index); return; }
      const monFilter = t.closest('[data-monitor-filter]'); if (monFilter) { S.monitor.filter = monFilter.dataset.monitorFilter; renderView(); return; }
      const monOpen = t.closest('[data-monitor-open]'); if (monOpen) { const row = monitorFeed().find((x) => x.id === monOpen.dataset.monitorOpen); S.monitor.read[monOpen.dataset.monitorOpen] = true; if (row) row.handler(); renderView(); return; }
      const check = t.closest('[data-monitor-check]'); if (check) { toast('检查完成（演示）', '34 个来源已核查；0 个新能力结论。真实更新需接入采集服务。'); return; }
      const cmdItem = t.closest('[data-command-index]'); if (cmdItem) { const it = commandAll[Number(cmdItem.dataset.commandIndex)]; if (it) { closeCommand(); it.action(); } return; }
    });
    document.addEventListener('input', (e) => {
      const t = e.target;
      if (t.id === 'radarSearch') { S.radar.q = t.value; renderViewFocus('radarSearch'); }
      else if (t.id === 'intelSearch') { S.intel.q = t.value; renderViewFocus('intelSearch'); }
      else if (t.id === 'creatorSearch') { S.creatorQuery = t.value; renderViewFocus('creatorSearch'); }
      else if (t.id === 'instSearch') { S.inst.q = t.value; renderViewFocus('instSearch'); }
      else if (t.id === 'commandInput') { renderCommand(t.value); }
      else if (t.id === 'studioStory') { S.studio.story = t.value; }
    });
    document.addEventListener('change', (e) => {
      const t = e.target;
      if (t.matches && t.matches('[data-video-check]')) {
        const idx = Number(t.dataset.videoCheck); S.videoCheck[idx] = t.checked;
        const badge = t.closest('.audit-panel') && t.closest('.audit-panel').querySelector('.badge');
        if (badge) badge.textContent = Object.values(S.videoCheck).filter(Boolean).length + '/' + document.querySelectorAll('[data-video-check]').length;
        return;
      }
      if (t.id === 'radarKind') { S.radar.kind = t.value; renderView(); }
      else if (t.id === 'radarStage') { S.radar.stage = t.value; renderView(); }
    });
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCommand(); return; }
      if (e.key === 'Escape') { closeDrawer(); closeModal(); closeCommand(); return; }
      if (e.key === 'Enter' && e.target.id === 'commandInput') { const first = $('#commandResults [data-command-index]'); if (first) first.click(); return; }
    });
    window.addEventListener('hashchange', () => { S.view = routeFromHash(); updateActiveNav(); renderView(); window.scrollTo({ top: 0 }); });
    window.addEventListener('popstate', () => { const v = routeFromHash(); if (v !== S.view) { S.view = v; updateActiveNav(); renderView(); } });
    const themeBtn = $('#themeToggle'); if (themeBtn) themeBtn.addEventListener('click', toggleTheme);
    const searchBtn = $('#searchTrigger'); if (searchBtn) searchBtn.addEventListener('click', openCommand);
  }

  function init() {
    // first paint: ensure a route
    if (!location.hash) history.replaceState(null, '', '#/home');
    S.view = routeFromHash();
    renderShell();
    bindEvents();
    renderView();
  }
  init();
})();

</script>
</body>
</html>
